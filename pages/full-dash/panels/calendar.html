<section class="card fd-panel" id="fd-calendar">
  <header class="fd-panel-head">
    <i class="ph ph-calendar-blank"></i>
    <h2 class="card-title" data-title>Today</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/calendar" data-tip="Open calendar" aria-label="Open calendar"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
/* Today and carried over on the left, the next six days on the right. */
#fd-calendar .fd-body { overflow: hidden; display: flex; }
#fd-calendar .fd-split { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
@container (min-width: 620px) {
  #fd-calendar .fd-split { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
}
#fd-calendar .fd-split-lead, #fd-calendar .fd-split-rest { min-height: 0; overflow-y: auto; }
#fd-calendar .fd-split-rest { border-left: 1px solid var(--border-subtle); padding-left: var(--sp-4); }
@container (max-width: 619px) {
  #fd-calendar .fd-split-rest { border-left: none; padding-left: 0; }
}
#fd-calendar .fd-item { gap: var(--sp-1); }
#fd-calendar .fd-item .fd-lead { width: 40px; font-size: 12px; }
/* A row with no time keeps the time column, so titles line up. */
#fd-calendar .fd-item:not(:has(.fd-lead)) .t { margin-left: calc(40px + var(--sp-1)); }
#fd-calendar .fd-item .fd-mark { font-weight: 500; }
/* The category colour is a dot at the row's end, as on the calendar page. */
#fd-calendar .fd-item.has-accent { border-left: none; padding-left: 0; }
#fd-calendar .fd-item.has-accent::after {
  content: ""; order: 9; flex: none;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--fd-accent); margin: 0 var(--sp-1);
}
#fd-calendar .fd-split-rest .fd-group + .fd-group { margin-top: var(--sp-3); }
#fd-calendar .fd-split-rest .fd-group-label { color: var(--text-primary); }
#fd-calendar .fd-split-rest .fd-item { min-height: var(--h-1); border-bottom: none; }
</style>
<script>FD.panel('calendar');</script>
