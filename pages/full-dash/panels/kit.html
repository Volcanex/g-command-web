<script>
window.FD = (function () {
  var cache = {};
  function cached(url, opts, parse) {
    opts = opts || {};
    var ttl = opts.ttl || 0;
    var now = Date.now();
    var hit = cache[url];
    if (hit && (now - hit.t) < ttl) return hit.p;
    var p = fetch(url, { credentials: 'same-origin' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
      return parse(res);
    });
    p.catch(function () { if (cache[url] && cache[url].p === p) delete cache[url]; });
    cache[url] = { t: now, p: p };
    return p;
  }
  function setState(el, cls, msg, detail) {
    while (el.firstChild) el.removeChild(el.firstChild);
    var em = document.createElement('em');
    em.className = cls;
    em.textContent = msg;
    if (detail) em.title = String(detail);
    el.appendChild(em);
  }
  // g-ui.js is deferred, so a panel that renders before it loads flattens
  // markdown itself: wikilinks to their label, emphasis and code marks gone.
  function plain(s) {
    if (window.g && g.plain) return g.plain(s);
    return String(s == null ? '' : s)
      .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (m, a, b) { return b || a; })
      .replace(/\*\*|__|`/g, '');
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  return {
    BRAIN: BRAIN_API,
    fetchJSON: function (url, opts) { return cached(url, opts, function (r) { return r.json(); }); },
    fetchText: function (url, opts) { return cached(url, opts, function (r) { return r.text(); }); },
    poll: function (fn, ms) {
      Promise.resolve().then(fn).catch(function () {});
      setInterval(function () {
        if (document.hidden) return;
        Promise.resolve().then(fn).catch(function () {});
      }, ms);
    },
    fail: function (el, msg, detail) { setState(el, 'fd-fail', msg, detail); },
    empty: function (el, msg) { setState(el, 'fd-empty', msg); },
    plain: plain,
    esc: function (s) {
      return plain(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    },
    iso: function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); },
    day: function (iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    },
    rel: function (iso) {
      if (!iso) return '';
      var t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      var s = Math.round((Date.now() - t) / 1000);
      var future = s < 0;
      s = Math.abs(s);
      var v = s < 60 ? s + 's' : s < 3600 ? Math.round(s / 60) + 'm'
            : s < 86400 ? Math.round(s / 3600) + 'h' : Math.round(s / 86400) + 'd';
      return future ? 'in ' + v : v + ' ago';
    },
    init: function (el) { if (window.g && g.init) g.init(el); }
  };
})();
</script>
