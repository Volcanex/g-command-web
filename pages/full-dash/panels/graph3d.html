<section class="card fd-panel" id="fd-graph3d">
  <header class="fd-panel-head">
    <i class="ph ph-graph"></i>
    <h2 class="card-title">Brain in 3D</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/graph" data-tip="Open graph" aria-label="Open graph"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
  #fd-graph3d .fd-canvas {
    height: 540px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface-1);
  }
  @media (max-width: 760px) {
    #fd-graph3d .fd-canvas { height: 380px; }
  }
  #fd-graph3d .fd-legend {
    display: flex;
    gap: var(--sp-4);
    flex-wrap: wrap;
    margin-top: var(--sp-2);
    font-size: 12px;
    color: var(--text-secondary);
  }
  #fd-graph3d .fd-legend .swatch {
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }
  #fd-graph3d .fd-legend .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  #fd-graph3d .scene-tooltip {
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--text-primary);
    background: var(--overlay-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px 8px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.79.0/dist/3d-force-graph.min.js"></script>
<script>(function () {
  var root = document.getElementById('fd-graph3d');
  var body = root.querySelector('[data-body]');
  var meta = root.querySelector('[data-meta]');

  function webglAvailable() {
    if (!window.WebGLRenderingContext) return false;
    try {
      var c = document.createElement('canvas');
      return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
    } catch (e) { return false; }
  }

  if (!webglAvailable()) {
    FD.fail(body, 'This browser has no WebGL. Open the 2D graph instead.');
    return;
  }
  if (typeof ForceGraph3D !== 'function') {
    FD.fail(body, 'The 3D graph library did not load. Open the 2D graph instead.');
    return;
  }

  FD.fetchJSON(FD.BRAIN + '/api/graph', { ttl: 60000 }).then(function (data) {
    var nodes = data.nodes, links = data.links;
    meta.textContent = nodes.length + ' nodes, ' + links.length + ' links';

    // Same colour assignment as pages/graph: kinds sorted, indexed into the
    // chart palette. The legend takes the var() so it follows a live theme
    // change; the scene takes the resolved sRGB, which WebGL needs.
    var kinds = Array.from(new Set(nodes.map(function (n) { return n.kind; }))).sort();
    function slot(kind) { return kinds.indexOf(kind) % 6 + 1; }
    function swatchColor(kind) { return 'var(--chart-' + slot(kind) + ')'; }
    function sceneColor(kind) { return FD.palette[slot(kind) - 1]; }

    // val = link degree (compute before the lib swaps ids for node objects)
    var degree = {};
    links.forEach(function (l) {
      degree[l.source] = (degree[l.source] || 0) + 1;
      degree[l.target] = (degree[l.target] || 0) + 1;
    });
    nodes.forEach(function (n) { n.val = degree[n.id] || 1; });

    body.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'fd-canvas';
    body.appendChild(el);

    var legend = document.createElement('div');
    legend.className = 'fd-legend';
    kinds.forEach(function (k) {
      var sw = document.createElement('span');
      sw.className = 'swatch';
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = swatchColor(k);
      sw.appendChild(dot);
      sw.appendChild(document.createTextNode(k));
      legend.appendChild(sw);
    });
    body.appendChild(legend);

    // The WebGL scene needs concrete colours, not CSS vars, so resolve the
    // live theme's plot ground and link grey through FD.color.
    var linkGrey = FD.color('--text-placeholder', '#696e77');
    var graph = ForceGraph3D()(el)
      .width(el.clientWidth)
      .height(el.clientHeight)
      .backgroundColor(FD.color('--surface-1', '#111113'))
      .showNavInfo(false)
      .nodeRelSize(4)
      .nodeLabel('title')
      .nodeColor(function (n) { return sceneColor(n.kind); })
      .linkColor(function () { return linkGrey; })
      .linkOpacity(0.35)
      .onNodeClick(function (n) { window.location.href = '/note/' + n.id; })
      .graphData({ nodes: nodes, links: links });

    try {
      if (typeof graph.renderer === 'function') {
        graph.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      }
    } catch (e) { /* pixel-ratio cap is best-effort */ }

    graph.controls().autoRotate = true;
    graph.controls().autoRotateSpeed = 0.5;
    el.addEventListener('pointerdown', function () {
      graph.controls().autoRotate = false;
    }, { once: true });

    new ResizeObserver(function () {
      graph.width(el.clientWidth).height(el.clientHeight);
    }).observe(el);

    // A theme flip changes the ground and the palette; the scene holds copies,
    // so re-resolve and push them back in.
    new MutationObserver(function () {
      FD.repalette();
      linkGrey = FD.color('--text-placeholder', '#696e77');
      graph.backgroundColor(FD.color('--surface-1', '#111113'))
        .nodeColor(function (n) { return sceneColor(n.kind); })
        .linkColor(function () { return linkGrey; });
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }).catch(function (e) {
    FD.fail(body, 'Graph data unavailable. Reload the page to try again.',
      (e && e.message) || e);
  });
})();</script>
