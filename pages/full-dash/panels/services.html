<section class="card fd-panel" id="fd-services">
  <header class="fd-panel-head">
    <i class="ph ph-pulse"></i>
    <h2 class="card-title">Services</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/system" data-tip="Open system" aria-label="Open system"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
  #fd-services { --row-h: 30px; }
  #fd-services .fd-body { max-height: 540px; overflow-y: auto; }
  #fd-services .fds-id { width: 42%; }
  #fd-services .fds-domain { color: var(--text-secondary); }
  #fd-services .fds-state { width: 68px; }
  #fd-services [data-meta] .fds-down-warn { color: var(--danger-text); }
</style>
<script>(function () {
  var panel = document.getElementById('fd-services');
  var body = panel.querySelector('[data-body]');
  var meta = panel.querySelector('[data-meta]');
  var LOCATIONS = { h: 'Nuremberg', b: 'Helsinki' };
  var STATE_RANK = { down: 0, unknown: 1, up: 2 };
  var BADGE = { up: 'badge-ok', down: 'badge-danger', unknown: 'badge-plain' };
  var STATE_LABEL = { up: 'Up', down: 'Down', unknown: 'Unknown' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render(data) {
    var summary = data.summary || {};
    var downPart = summary.down + ' down';
    if (summary.down > 0) downPart = '<span class="fds-down-warn">' + downPart + '</span>';
    var checked = FD.rel(data.checked_at);
    meta.innerHTML = summary.up + ' up, ' + downPart + ', ' + esc(checked);
    meta.title = 'Checked ' + checked;

    var byHost = {};
    var hostOrder = [];
    (data.services || []).forEach(function (s) {
      var h = s.host || '?';
      if (!byHost[h]) { byHost[h] = []; hostOrder.push(h); }
      byHost[h].push(s);
    });

    var html = '';
    hostOrder.forEach(function (h) {
      var svcs = byHost[h].slice().sort(function (a, b) {
        var ra = STATE_RANK[a.state] !== undefined ? STATE_RANK[a.state] : 1;
        var rb = STATE_RANK[b.state] !== undefined ? STATE_RANK[b.state] : 1;
        return ra - rb;
      });
      var loc = LOCATIONS[h];
      var label = 'Host ' + h + (loc ? ', ' + loc : '');
      html += '<div class="fd-group">' +
        '<div class="fd-group-label">' + esc(label) + '</div>' +
        '<div class="table-wrap"><table class="table"><tbody>';
      svcs.forEach(function (s) {
        var state = STATE_RANK[s.state] !== undefined ? s.state : 'unknown';
        html += '<tr title="' + esc(s.method + ': ' + s.detail) + '">' +
          '<td class="fds-id">' + esc(s.id) + '</td>' +
          '<td class="fds-domain">' + esc(s.domain || '') + '</td>' +
          '<td class="r fds-state"><span class="badge ' + BADGE[state] + '">' +
            esc(STATE_LABEL[state]) + '</span></td>' +
          '</tr>';
      });
      html += '</tbody></table></div></div>';
    });
    body.innerHTML = html;
  }

  FD.poll(function () {
    return FD.fetchJSON(FD.BRAIN + '/api/status', { ttl: 30000 })
      .then(render)
      .catch(function (e) {
        FD.fail(body, 'Service health unavailable. The panel retries every minute.',
          (e && e.message) || e);
      });
  }, 60000);
})();</script>
