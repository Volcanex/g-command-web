<section class="card fd-panel" id="fd-topology">
  <header class="fd-panel-head">
    <i class="ph ph-cube"></i>
    <h2 class="card-title">Topology</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/gcore" data-tip="Open gcore" aria-label="Open gcore"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
  #fd-topology .fd-topo-wrap {
    position: relative;
    height: 420px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    background: var(--surface-1);
    overflow: hidden;
  }
  #fd-topology .fd-topo-cy { position: absolute; inset: 0; }
  #fd-topology .fd-topo-legend {
    position: absolute;
    left: var(--sp-2);
    bottom: var(--sp-2);
    font-size: 12px;
    color: var(--text-secondary);
    pointer-events: none;
  }
  #fd-topology .fd-topo-legend span {
    display: inline-flex;
    align-items: center;
    margin-right: var(--sp-3);
  }
  #fd-topology .fd-topo-legend i {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script>(function () {
  var panel = document.getElementById('fd-topology');
  var body = panel.querySelector('[data-body]');
  var meta = panel.querySelector('[data-meta]');

  var SLOT = { system: 1, meta: 5, external: 4, source: 3 };
  var LABELS = {
    system: 'System', meta: 'Meta', external: 'External', source: 'Source'
  };
  var ORDER = ['system', 'meta', 'external', 'source'];

  FD.fetchJSON('/api/full-dash/diagram').then(function (res) {
    if (typeof cytoscape === 'undefined') {
      FD.fail(body, 'The graph library did not load. Reload the page to try again.');
      return;
    }
    var elements = (res && res.elements) || [];
    var nodeCount = elements.filter(function (el) {
      return el.data && !el.data.source;
    }).length;
    var defaultMeta = nodeCount + ' nodes';
    meta.textContent = defaultMeta;

    body.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'fd-topo-wrap';
    var holder = document.createElement('div');
    holder.className = 'fd-topo-cy';
    wrap.appendChild(holder);

    var legend = document.createElement('div');
    legend.className = 'fd-topo-legend';
    ORDER.forEach(function (t) {
      var item = document.createElement('span');
      var dot = document.createElement('i');
      dot.style.background = 'var(--chart-' + SLOT[t] + ')';
      item.appendChild(dot);
      item.appendChild(document.createTextNode(LABELS[t]));
      legend.appendChild(item);
    });
    wrap.appendChild(legend);
    body.appendChild(wrap);

    // Cytoscape holds copies of whatever colours it was given and needs
    // concrete ones, not CSS vars, so the sheet is rebuilt from the live
    // theme here and again whenever data-theme flips.
    function themeStyle() {
      FD.repalette();
      var faint = FD.color('--text-placeholder', '#696e77');
      var muted = FD.color('--text-secondary', '#b0b4ba');
      var colors = {};
      ORDER.forEach(function (t) { colors[t] = FD.palette[SLOT[t] - 1]; });
      function typeColor(ele) { return colors[ele.data('type')] || faint; }
      return [
        { selector: 'node', style: {
          'shape': 'round-rectangle',
          'width': 'label',
          'height': 'label',
          'padding': '8px',
          'background-color': typeColor,
          'background-opacity': 0.15,
          'border-width': 1,
          'border-color': typeColor,
          'label': 'data(label)',
          'font-family': 'InterVariable, Inter, sans-serif',
          'font-size': '10px',
          'color': FD.color('--text-primary', '#edeef0'),
          'text-wrap': 'wrap',
          'text-max-width': '90px',
          'text-valign': 'center',
          'text-halign': 'center'
        } },
        { selector: 'node[?highlight]', style: {
          'border-color': FD.color('--warn-text', '#ffca16')
        } },
        { selector: 'edge', style: {
          'width': 1,
          'line-color': faint,
          'curve-style': 'bezier',
          'target-arrow-shape': 'triangle',
          'target-arrow-color': faint,
          'arrow-scale': 0.6,
          'label': 'data(label)',
          'font-family': 'InterVariable, Inter, sans-serif',
          'font-size': '8px',
          'color': muted,
          'text-rotation': 'autorotate',
          'text-background-color': FD.color('--surface-1', '#111113'),
          'text-background-opacity': 1,
          'text-background-padding': '1px'
        } },
        { selector: '.fd-topo-dim', style: {
          'opacity': 0.2
        } }
      ];
    }

    var cy = cytoscape({
      container: holder,
      elements: elements,
      userZoomingEnabled: false,
      style: themeStyle()
    });

    cy.layout({ name: 'cose', animate: false, padding: 24 }).run();

    new MutationObserver(function () {
      cy.style(themeStyle());
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    cy.on('tap', 'node', function (evt) {
      var hood = evt.target.closedNeighborhood();
      cy.elements().not(hood).addClass('fd-topo-dim');
      hood.removeClass('fd-topo-dim');
      meta.textContent = evt.target.data('subtitle') || evt.target.data('label') || '';
    });
    cy.on('tap', function (evt) {
      if (evt.target === cy) {
        cy.elements().removeClass('fd-topo-dim');
        meta.textContent = defaultMeta;
      }
    });
  }).catch(function (err) {
    FD.fail(body, 'Topology diagram unavailable. Reload the page to try again.',
      (err && err.message) || err);
  });
})();</script>
