<section class="card fd-panel" id="fd-refs">
  <header class="fd-panel-head">
    <i class="ph ph-link"></i>
    <h2 class="card-title">Refs</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/refs" data-tip="Open refs" aria-label="Open refs"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
  #fd-refs .fdr-hero { text-align: center; padding: var(--sp-4) 0 var(--sp-3); }
  #fd-refs .fdr-num {
    font-size: 44px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  #fd-refs .fdr-num.broken { color: var(--danger-text); }
  #fd-refs .fdr-num.healthy { color: var(--ok-text); }
  #fd-refs .fdr-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  #fd-refs .fdr-list { display: flex; flex-direction: column; }
  #fd-refs .fdr-row {
    display: block;
    font-size: 12px;
    color: var(--danger-text);
    text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 5px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  #fd-refs .fdr-row:last-child { border-bottom: none; }
  #fd-refs .fdr-row:hover { text-decoration: underline; }
  #fd-refs .fdr-empty { text-align: center; }
</style>
<script>(function () {
  var panel = document.getElementById('fd-refs');
  var body = panel.querySelector('[data-body]');
  var meta = panel.querySelector('[data-meta]');

  function render(data) {
    var urls = (data.nodes || []).filter(function (n) { return n.type === 'url'; });
    var brokenUrls = urls.filter(function (n) { return n.broken; });
    var total = urls.length;
    var broken = brokenUrls.length;

    if (total === 0) {
      meta.textContent = '';
      FD.empty(body, 'No refs indexed yet.');
      return;
    }

    var healthy = Math.round(((total - broken) / total) * 100);
    var kind = broken ? 'warn' : 'ok';
    var label = healthy + '% healthy';
    var badge = meta.querySelector('.badge');
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      meta.innerHTML = '';
      meta.appendChild(badge);
    }
    // g.status swells the pill when the figure moves; plain assignment is the
    // fallback if g-ui.js has not finished loading.
    if (window.g && g.status) {
      g.status(badge, { kind: kind, label: label });
    } else {
      badge.className = 'badge badge-' + kind;
      badge.textContent = label;
    }

    body.innerHTML = '';

    var hero = document.createElement('div');
    hero.className = 'fdr-hero';
    var num = document.createElement('div');
    num.className = 'fdr-num ' + (broken > 0 ? 'broken' : 'healthy');
    num.textContent = String(broken);
    var sub = document.createElement('div');
    sub.className = 'fdr-sub';
    sub.textContent = 'of ' + total + ' refs broken';
    hero.appendChild(num);
    hero.appendChild(sub);
    body.appendChild(hero);

    if (broken > 0) {
      var list = document.createElement('div');
      list.className = 'fdr-list';
      brokenUrls.slice(0, 8).forEach(function (n) {
        var row = document.createElement('a');
        row.className = 'fdr-row';
        row.href = n.url;
        row.target = '_blank';
        row.rel = 'noopener';
        row.title = n.url;
        row.textContent = n.url;
        list.appendChild(row);
      });
      body.appendChild(list);
    } else {
      var ok = document.createElement('div');
      ok.className = 'fdr-empty';
      FD.empty(ok, 'Every ref resolves.');
      body.appendChild(ok);
    }
  }

  FD.poll(function () {
    return FD.fetchJSON(FD.BRAIN + '/api/refs/graph')
      .then(render)
      .catch(function (e) {
        FD.fail(body, 'Ref health unavailable. The panel retries every 10 minutes.',
          (e && e.message) || e);
      });
  }, 600000);
})();</script>
