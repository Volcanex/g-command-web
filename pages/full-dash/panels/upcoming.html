<section class="card fd-panel" id="fd-upcoming">
  <header class="fd-panel-head">
    <i class="ph ph-calendar-dots"></i>
    <h2 class="card-title">Upcoming</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/todos" data-tip="Open todos" aria-label="Open todos"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
#fd-upcoming .fd-body { max-height: 420px; overflow-y: auto; }
#fd-upcoming .fdu-day + .fdu-day { margin-top: var(--sp-3); }
#fd-upcoming .fdu-head {
  font-size: 12px; font-weight: 500;
  color: var(--text-secondary);
  padding-bottom: 4px;
}
#fd-upcoming .fdu-head.fdu-today {
  color: var(--chart-1);
  border-bottom: 1px solid var(--chart-1);
}
#fd-upcoming ul.fdu-items { list-style: none; margin: 0; padding: 0; }
#fd-upcoming li.fdu-item {
  display: flex; align-items: baseline; gap: var(--sp-3);
  padding: 4px 0;
  border-bottom: 1px solid var(--border-subtle);
}
#fd-upcoming li.fdu-item:last-child { border-bottom: none; }
#fd-upcoming .fdu-title {
  flex: 1; min-width: 0;
  font-size: var(--font-size-ui); color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#fd-upcoming .fdu-time {
  flex: none; margin-left: auto; text-align: right;
  font-size: 12px; color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
#fd-upcoming li.fdu-past .fdu-title,
#fd-upcoming li.fdu-past .fdu-time { color: var(--text-placeholder); }
</style>
<script>(function () {
  var panel = document.getElementById('fd-upcoming');
  var body = panel.querySelector('[data-body]');
  var meta = panel.querySelector('[data-meta]');
  var DAY_MS = 86400000;

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function hasTime(t, iso) {
    if (t.all_day) return false;
    if (!/T/.test(iso)) return false;
    var d = new Date(iso);
    if (isNaN(d)) return false;
    return d.getHours() !== 0 || d.getMinutes() !== 0;
  }

  function itemDate(t) {
    var dates = [];
    if (t.start) dates.push(t.start);
    if (t.due) dates.push(t.due);
    var best = null, bestIso = null;
    dates.forEach(function (iso) {
      var d = new Date(iso);
      if (isNaN(d)) return;
      if (best === null || d < best) { best = d; bestIso = iso; }
    });
    return best === null ? null : { d: best, iso: bestIso };
  }

  function dayLabel(idx, dayStart) {
    if (idx === 0) return 'Today';
    if (idx === 1) return 'Tomorrow';
    return dayStart.toLocaleDateString('en-GB',
      { weekday: 'short', day: 'numeric', month: 'short' }).replace(/,/g, '');
  }

  function render(data) {
    var todos = Array.isArray(data) ? data : (data && Array.isArray(data.todos) ? data.todos : []);

    var now = new Date();
    var winStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var winEnd = new Date(winStart.getTime() + 7 * DAY_MS);

    var days = {};
    var total = 0;
    todos.forEach(function (t) {
      var when = itemDate(t);
      if (!when) return;
      if (when.d < winStart || when.d > winEnd) return;
      var localDay = new Date(when.d.getFullYear(), when.d.getMonth(), when.d.getDate());
      var idx = Math.round((localDay - winStart) / DAY_MS);
      if (!days[idx]) days[idx] = [];
      days[idx].push({ todo: t, d: when.d, iso: when.iso });
      total++;
    });

    meta.textContent = total ? total + ' this week' : '';
    if (!total) { FD.empty(body, 'Clear week.'); return; }

    var html = '';
    Object.keys(days).map(Number).sort(function (a, b) { return a - b; })
      .forEach(function (idx) {
        var items = days[idx];
        items.sort(function (a, b) { return a.d - b.d; });
        var dayStart = new Date(winStart.getTime() + idx * DAY_MS);
        var rows = items.map(function (it) {
          var t = it.todo;
          var timed = hasTime(t, it.iso);
          var past = idx === 0 && timed && it.d < now;
          var row = '<li class="fdu-item' + (past ? ' fdu-past' : '') + '">' +
            '<span class="fdu-title">' + esc(t.title || t.slug || '(untitled)') + '</span>';
          if (timed) {
            var hh = ('0' + it.d.getHours()).slice(-2);
            var mm = ('0' + it.d.getMinutes()).slice(-2);
            row += '<span class="fdu-time">' + hh + ':' + mm + '</span>';
          }
          row += '</li>';
          return row;
        }).join('');
        html += '<div class="fdu-day">' +
          '<div class="fdu-head' + (idx === 0 ? ' fdu-today' : '') + '">' +
          esc(dayLabel(idx, dayStart)) + '</div>' +
          '<ul class="fdu-items">' + rows + '</ul></div>';
      });

    body.innerHTML = html;
  }

  FD.poll(function () {
    FD.fetchJSON(FD.BRAIN + '/api/todos?status=open', { ttl: 60000 })
      .then(render)
      .catch(function (e) {
        FD.fail(body, 'Upcoming items unavailable. The panel retries every 5 minutes.',
          (e && e.message) || e);
      });
  }, 300000);
})();</script>
