<section class="card fd-panel" id="fd-inlets">
  <header class="fd-panel-head">
    <i class="ph ph-waves"></i>
    <h2 class="card-title">Inlets</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/pulse" data-tip="Open pulse" aria-label="Open pulse"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
  #fd-inlets .table td { height: auto; padding-top: 6px; padding-bottom: 6px; }
  #fd-inlets .fdi-title {
    color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #fd-inlets .fdi-summary {
    font-size: 12px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #fd-inlets .fdi-when {
    width: 120px;
    font-size: 12px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  #fd-inlets .fdi-when div {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #fd-inlets .fdi-state { width: 68px; }
</style>
<script>(function () {
  var panel = document.getElementById('fd-inlets');
  var body = panel.querySelector('[data-body]');
  var meta = panel.querySelector('[data-meta]');
  var RECENT_MS = 24 * 60 * 60 * 1000;
  var BADGE = { fresh: 'badge-ok', stale: 'badge-warn', stub: 'badge-plain' };
  var STATE_LABEL = { fresh: 'Fresh', stale: 'Stale', stub: 'Stub' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function state(inlet) {
    if (inlet.status === 'stub') return 'stub';
    if (!inlet.last_run) return 'stale';
    var t = Date.parse(inlet.last_run);
    if (isNaN(t) || Date.now() - t > RECENT_MS) return 'stale';
    return 'fresh';
  }

  function render(inlets) {
    inlets = Array.isArray(inlets) ? inlets : [];
    var stubs = inlets.filter(function (i) { return i.status === 'stub'; }).length;
    var active = inlets.length - stubs;
    meta.textContent = active + ' active, ' + stubs + ' stubs';

    if (!inlets.length) {
      FD.empty(body, 'No inlets defined.');
      return;
    }

    var html = '<div class="table-wrap"><table class="table"><tbody>';
    inlets.forEach(function (i) {
      var last = i.last_run ? 'last run ' + FD.rel(i.last_run) : 'never run';
      var st = state(i);
      html += '<tr>' +
        '<td><div class="fdi-title">' + esc(i.title || i.id) + '</div>' +
          (i.summary ? '<div class="fdi-summary">' + esc(i.summary) + '</div>' : '') +
        '</td>' +
        '<td class="r fdi-when"><div>' + esc(i.schedule || 'no schedule') + '</div>' +
          '<div>' + esc(last) + '</div></td>' +
        '<td class="r fdi-state"><span class="badge ' + BADGE[st] + '">' +
          esc(STATE_LABEL[st]) + '</span></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    body.innerHTML = html;
  }

  FD.poll(function () {
    return FD.fetchJSON(FD.BRAIN + '/api/pulse/inlets', { ttl: 300000 })
      .then(render)
      .catch(function (e) {
        FD.fail(body, 'Inlet status unavailable. The panel retries every 10 minutes.',
          (e && e.message) || e);
      });
  }, 600000);
})();</script>
