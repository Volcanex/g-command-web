<section class="card fd-panel" id="fd-voice">
  <header class="fd-panel-head">
    <i class="ph ph-chat-circle-dots"></i>
    <h2 class="card-title">Voice</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/voice" data-tip="Open voice" aria-label="Open voice"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
  #fd-voice .table td { height: auto; padding-top: 6px; padding-bottom: 6px; }
  #fd-voice .fdv-label { color: var(--text-primary); }
  #fd-voice .fdv-detail {
    font-size: 12px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #fd-voice .fdv-detail.low { color: var(--warn-text); }
  #fd-voice .fdv-state { width: 68px; }
  #fd-voice [data-meta] .fdv-model { font-family: var(--font-mono); font-size: 0.925em; }
</style>
<script>(function () {
  var panel = document.getElementById('fd-voice');
  var body = panel.querySelector('[data-body]');
  var meta = panel.querySelector('[data-meta]');

  var ORDER = ['engine', 'telnyx_balance', 'brain', 'outlet', 'transport_creds'];
  var LABELS = {
    engine: 'Engine',
    telnyx_balance: 'Telnyx balance',
    brain: 'Brain',
    outlet: 'Calendar outlet',
    transport_creds: 'Transport creds'
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render(data) {
    var model = String(data.model || '');
    var slash = model.indexOf('/');
    if (slash !== -1) model = model.slice(slash + 1);
    var metaHtml = '<span class="fdv-model">' + esc(model) + '</span>';
    if (!data.ok) metaHtml += ' <span class="badge badge-danger">Degraded</span>';
    meta.innerHTML = metaHtml;

    var checks = data.checks || {};
    var html = '<div class="table-wrap"><table class="table"><tbody>';
    ORDER.forEach(function (key) {
      var c = checks[key];
      if (!c) return;
      var detail = c.detail;
      if (key === 'transport_creds') {
        detail = (c.missing && c.missing.length)
          ? 'missing: ' + c.missing.join(', ')
          : 'all present';
      }
      var detailCls = 'fdv-detail';
      if (key === 'telnyx_balance' && typeof c.balance === 'number' && c.balance < 5) {
        detailCls += ' low';
      }
      html += '<tr>' +
        '<td><div class="fdv-label">' + esc(LABELS[key]) + '</div>' +
          (detail ? '<div class="' + detailCls + '">' + esc(detail) + '</div>' : '') +
        '</td>' +
        '<td class="r fdv-state"><span class="badge ' +
          (c.ok ? 'badge-ok">Ok' : 'badge-danger">Down') + '</span></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    body.innerHTML = html;
  }

  FD.poll(function () {
    return FD.fetchJSON('/api/full-dash/voice-health', { ttl: 60000 })
      .then(render)
      .catch(function (e) {
        FD.fail(body, 'Voice health unavailable. The panel retries every 5 minutes.',
          (e && e.message) || e);
      });
  }, 300000);
})();</script>
