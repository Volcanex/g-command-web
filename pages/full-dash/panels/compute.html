<section class="card fd-panel" id="fd-compute">
  <header class="fd-panel-head">
    <i class="ph ph-gauge"></i>
    <h2 class="card-title">Compute</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/compute" data-tip="Open compute" aria-label="Open compute"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
/* Quota cards: one column, three side by side from 560px wide, with the
   credit and hours line under them. */
#fd-compute .fd-blocks { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); }
#fd-compute .fd-blocks > * { margin-top: 0; }
@container (min-width: 560px) {
  #fd-compute .fd-blocks { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--sp-4); }
}
#fd-compute .fd-meter-head { font-size: var(--font-size-ui); color: var(--text-primary); }
#fd-compute .fd-meter-text { font-weight: 500; }
#fd-compute .fd-line { grid-column: 1 / -1; justify-content: space-between; padding-top: var(--sp-2); border-top: 1px solid var(--border-subtle); }
</style>
<script>FD.panel('compute');</script>
