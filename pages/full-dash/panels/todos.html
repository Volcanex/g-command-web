<section class="card fd-panel" id="fd-todos">
  <header class="fd-panel-head">
    <i class="ph ph-check-square"></i>
    <h2 class="card-title">Tasks</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/todos" data-tip="Open todos" aria-label="Open todos"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
#fd-todos .fd-body { max-height: 420px; overflow-y: auto; }
#fd-todos .fdt-group + .fdt-group { margin-top: var(--sp-3); }
#fd-todos .fdt-label {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 12px; font-weight: 500;
  color: var(--text-secondary);
  padding-bottom: 4px;
}
#fd-todos .fdt-count {
  font-weight: 400; color: var(--text-placeholder);
  font-variant-numeric: tabular-nums;
}
#fd-todos ul.fdt-items { list-style: none; margin: 0; padding: 0; }
#fd-todos li.fdt-item {
  display: flex; align-items: baseline; gap: var(--sp-3);
  padding: 4px 0 4px var(--sp-2);
  border-left: 2px solid var(--text-placeholder);
  border-bottom: 1px solid var(--border-subtle);
}
#fd-todos li.fdt-item:last-child { border-bottom: none; }
#fd-todos .fdt-title {
  flex: 1; min-width: 0;
  font-size: var(--font-size-ui); color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#fd-todos .fdt-due {
  flex: none; font-size: 12px; color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
#fd-todos .fdt-due.fdt-overdue { color: var(--danger-text); }
#fd-todos details.fdt-fold summary {
  cursor: pointer; list-style: none;
  font-size: 12px; font-weight: 500;
  color: var(--text-secondary);
  padding-bottom: 4px;
}
#fd-todos details.fdt-fold summary::-webkit-details-marker { display: none; }
#fd-todos details.fdt-fold summary::before { content: '\25B8 '; color: var(--text-placeholder); }
#fd-todos details.fdt-fold[open] summary::before { content: '\25BE '; }
#fd-todos .fdt-more {
  font-size: 12px; color: var(--text-placeholder);
  margin-top: var(--sp-2);
}
</style>
<script>(function () {
  var panel = document.getElementById('fd-todos');
  var body = panel.querySelector('[data-body]');
  var meta = panel.querySelector('[data-meta]');
  var MAX_VISIBLE = 12;

  var STRIPE = {
    P0: 'var(--chart-5)',
    P1: 'var(--chart-4)',
    P2: 'var(--chart-1)',
    P3: 'var(--text-placeholder)'
  };

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmtDue(iso, now) {
    var d = new Date(iso);
    if (isNaN(d)) return null;
    return {
      text: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }),
      overdue: d < now
    };
  }

  function itemHTML(t, prio, now) {
    var html = '<li class="fdt-item" style="border-left-color:' + STRIPE[prio] + '">' +
      '<span class="fdt-title">' + esc(t.title || t.slug || '(untitled)') + '</span>';
    if (t.due) {
      var due = fmtDue(t.due, now);
      if (due) {
        html += '<span class="fdt-due' + (due.overdue ? ' fdt-overdue' : '') + '">' +
          esc(due.text) + '</span>';
      }
    }
    html += '</li>';
    return html;
  }

  function render(data) {
    var todos = Array.isArray(data) ? data : (data && Array.isArray(data.todos) ? data.todos : []);
    // Calendar events (start, no due) aren't actionable, they live in the
    // Upcoming panel and never get ticked off. Show real tasks only here.
    todos = todos.filter(function (t) { return t.due || !t.start; });
    meta.textContent = todos.length + ' open';
    if (!todos.length) { FD.empty(body, 'Nothing open.'); return; }

    var now = new Date();
    var prios = ['P0', 'P1', 'P2', 'P3'];
    var groups = { P0: [], P1: [], P2: [], P3: [] };
    todos.forEach(function (t) {
      var p = prios.indexOf(t.priority) >= 0 ? t.priority : 'P3';
      groups[p].push(t);
    });

    var html = '';
    var shown = 0;
    prios.forEach(function (p) {
      var items = groups[p];
      if (!items.length || shown >= MAX_VISIBLE) return;
      var take = items.slice(0, MAX_VISIBLE - shown);
      shown += take.length;
      var rows = take.map(function (t) { return itemHTML(t, p, now); }).join('');
      var list = '<ul class="fdt-items">' + rows + '</ul>';
      if (p === 'P3' && items.length > 5) {
        html += '<div class="fdt-group"><details class="fdt-fold">' +
          '<summary>P3 (' + items.length + ')</summary>' + list + '</details></div>';
      } else {
        html += '<div class="fdt-group">' +
          '<div class="fdt-label">' + p +
          ' <span class="fdt-count">' + items.length + '</span></div>' +
          list + '</div>';
      }
    });

    var hidden = todos.length - shown;
    if (hidden > 0) {
      html += '<div class="fdt-more">' + hidden + ' more in the todos page</div>';
    }
    body.innerHTML = html;
  }

  FD.poll(function () {
    FD.fetchJSON(FD.BRAIN + '/api/todos?status=open', { ttl: 60000 })
      .then(render)
      .catch(function (e) {
        FD.fail(body, 'Tasks unavailable. The panel retries every 5 minutes.',
          (e && e.message) || e);
      });
  }, 300000);
})();</script>
