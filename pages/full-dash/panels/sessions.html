<section class="card fd-panel" id="fd-sessions">
  <header class="fd-panel-head">
    <i class="ph ph-terminal"></i>
    <h2 class="card-title">Sessions</h2>
    <span class="fd-spacer"></span>
    <span class="fd-meta" data-meta></span>
    <a class="btn btn-tertiary btn-sm btn-icon" href="/sessions" data-tip="Open sessions" aria-label="Open sessions"><i class="ph ph-arrow-up-right"></i></a>
  </header>
  <div class="fd-body" data-body><em class="fd-loading">Loading…</em></div>
</section>
<style>
  #fd-sessions { --row-h: 30px; }
  #fd-sessions .fd-body { max-height: 480px; overflow-y: auto; }
  #fd-sessions .fdt-name {
    display: inline-flex; align-items: center; gap: 7px;
    text-decoration: none; color: var(--text-primary);
    white-space: nowrap;
  }
  #fd-sessions .fdt-name:hover { text-decoration: underline; }
  #fd-sessions .fdt-name .ph { color: var(--text-placeholder); font-size: 14px; }
  #fd-sessions .fdt-info {
    width: 210px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  #fd-sessions .fdt-none {
    font-size: 12px; color: var(--text-placeholder); padding: 2px 0;
  }
</style>
<script>(function () {
  var panel = document.getElementById('fd-sessions');
  var body = panel.querySelector('[data-body]');
  var meta = panel.querySelector('[data-meta]');
  var LOCATIONS = { h: 'Nuremberg', b: 'Helsinki' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function ago(ts) {
    if (!ts) return '?';
    var s = Math.floor(Date.now() / 1000 - Number(ts));
    if (s < 0) s = 0;
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  function render(data) {
    var hosts = data.hosts || {};
    var hostOrder = Object.keys(hosts);
    var total = 0;
    hostOrder.forEach(function (h) {
      if (Array.isArray(hosts[h])) total += hosts[h].length;
    });

    meta.textContent = total + (total === 1 ? ' session' : ' sessions');

    if (total === 0) {
      FD.empty(body, 'No tmux sessions on any host.');
      return;
    }

    var html = '';
    hostOrder.forEach(function (h) {
      var loc = LOCATIONS[h];
      var label = 'Host ' + h + (loc ? ', ' + loc : '');
      html += '<div class="fd-group">' +
        '<div class="fd-group-label">' + esc(label) + '</div>';

      var sessions = hosts[h];
      if (!Array.isArray(sessions) || sessions.length === 0) {
        // The API collapses SSH/tmux failures to an empty list, so "no
        // sessions" and "unreachable" are indistinguishable here.
        html += '<div class="fdt-none">No sessions, or the host is unreachable.</div></div>';
        return;
      }

      sessions = sessions.slice().sort(function (a, b) {
        return (b.last_activity || 0) - (a.last_activity || 0);
      });

      html += '<div class="table-wrap"><table class="table"><tbody>';
      sessions.forEach(function (s) {
        var info = [];
        if (s.attached) info.push('attached');
        info.push((s.windows || 0) + 'w');
        info.push('used ' + ago(s.last_activity));
        var href = '/sessions?attach=' + encodeURIComponent(h + '/' + s.name);
        html += '<tr>' +
          '<td><a class="fdt-name" href="' + esc(href) + '">' +
            '<i class="ph ph-terminal"></i>' + esc(s.name) + '</a></td>' +
          '<td class="r fdt-info">' + esc(info.join(', ')) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table></div></div>';
    });
    body.innerHTML = html;
  }

  FD.poll(function () {
    return FD.fetchJSON('/api/sessions', { ttl: 30000 })
      .then(render)
      .catch(function (e) {
        FD.fail(body, 'Session list unavailable. The panel retries every minute.',
          (e && e.message) || e);
      });
  }, 60000);
})();</script>
