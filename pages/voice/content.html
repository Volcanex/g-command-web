<div class="page-head">
  <h1>Voice</h1>
  <span class="badge badge-plain">Call or text</span>
</div>
<p class="page-sub">Call the brain or text it. The same agent that answers on WhatsApp.</p>

<div class="card call" data-call data-state="idle">
  <button type="button" class="call-orb" data-orb aria-label="Voice" disabled>
    <canvas data-orb-canvas width="200" height="200"></canvas>
  </button>
  <p class="call-state" data-call-state aria-live="polite">Not in a call</p>
  <div class="call-captions">
    <p class="call-user" data-cap-user></p>
    <p class="call-reply" data-cap-reply aria-live="polite"></p>
  </div>
  <div class="call-row">
    <button type="button" class="btn btn-primary" data-call-btn><i class="ph ph-phone"></i><span data-call-label>Call</span></button>
    <button type="button" class="btn" data-mute-btn aria-pressed="false" disabled><i class="ph ph-microphone-slash"></i><span data-mute-label>Mute</span></button>
  </div>
  <form class="call-say" data-say-form>
    <input class="input" data-say-input placeholder="Type a line into the call" autocomplete="off" disabled>
    <button type="submit" class="btn" data-say-btn disabled>Say it</button>
  </form>
  <p class="call-error" data-call-error hidden><span data-call-error-text></span> <button type="button" class="btn btn-sm" data-retry>Call again</button></p>
  <p class="call-meta num" data-call-meta><span data-meta-engine></span><span data-meta-turn></span></p>
  <p class="call-note">Talk over it to cut it off, or tap the circle. On laptop speakers it can hear itself, headphones fix that.</p>
</div>

<div class="card chat" data-chat>
  <div class="chat-log" data-log>
    <div class="msg brain">
      <div class="bubble">Hi, I'm the voice of your brain. Ask me something, or tell me to remember a todo.</div>
    </div>
  </div>
  <form class="chat-form" data-form>
    <textarea class="input" data-input rows="1" placeholder="Message your brain" autocomplete="off"></textarea>
    <button type="submit" class="btn btn-primary" data-send>Send</button>
  </form>
  <span class="chat-msg" data-err></span>
</div>

<style>
  .page-head { display: flex; align-items: center; gap: 10px; }
  .page-head h1 { font-size: 18px; margin: 0; }
  .page-sub { margin: 6px 0 var(--sp-4); font-size: var(--font-size-ui); color: var(--text-secondary); }
  .chat { display: flex; flex-direction: column; gap: var(--sp-3); max-width: 720px; }
  .chat-log {
    display: flex; flex-direction: column; gap: var(--sp-2);
    min-height: 280px; max-height: 60vh; overflow-y: auto;
    padding: var(--sp-1) 0;
  }
  .msg { display: flex; }
  .msg.me { justify-content: flex-end; }
  .msg .bubble {
    max-width: 78%; padding: 8px 12px; border-radius: 12px;
    font-size: var(--font-size-ui); line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.me .bubble { background: var(--accent-fill); color: var(--accent-fg); border-bottom-right-radius: var(--radius-sm); }
  .msg.brain .bubble { background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border-subtle); border-bottom-left-radius: var(--radius-sm); }
  .msg .bubble strong { font-weight: 600; }
  .msg .bubble code { font-family: var(--font-mono); font-size: 0.9em; background: var(--fill-hover); padding: 0 4px; border-radius: 3px; }
  .msg.me .bubble code { background: rgb(255 255 255 / 0.18); }
  .msg .bubble a { color: inherit; text-decoration: underline; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 3px 0; }
  .typing span { width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--text-placeholder); animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: 0.6; } }

  .chat-form { display: flex; gap: var(--sp-2); align-items: flex-end; }
  .chat-form textarea { flex: 1; resize: none; max-height: 160px; min-height: var(--h-control); line-height: 1.5; }
  .chat-msg { color: var(--danger-text); font-size: 12px; min-height: 1em; }

  .call {
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
    max-width: 720px; margin-bottom: var(--sp-4); padding: var(--sp-6) var(--sp-4);
  }
  .call-orb {
    width: 160px; height: 160px; padding: 0; border: 0; background: none;
    border-radius: var(--radius-full); cursor: default;
  }
  .call[data-state="speaking"] .call-orb { cursor: pointer; }
  .call-orb canvas { width: 160px; height: 160px; display: block; }
  .call-state { margin: 0; font-size: var(--font-size-ui); color: var(--text-secondary); min-height: var(--lh-ui, 20px); }
  .call-captions { width: 100%; display: flex; flex-direction: column; gap: var(--sp-2); text-align: center; min-height: 72px; }
  .call-user { margin: 0; font-size: var(--font-size-ui); color: var(--text-secondary); min-height: 20px; }
  .call-reply { margin: 0; font-size: 15px; line-height: 24px; color: var(--text-primary); min-height: 24px; overflow-wrap: anywhere; }
  .call-row { display: flex; gap: var(--sp-2); }
  .call-row .btn { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .call[data-state]:not([data-state="idle"]):not([data-state="error"]) [data-call-btn] { background: var(--danger-fill, var(--accent-fill)); }
  .call-say { display: flex; gap: var(--sp-2); width: 100%; }
  .call-say .input { flex: 1; min-width: 0; min-height: var(--h-control); }
  .call-error { margin: 0; display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; justify-content: center; color: var(--danger-text); font-size: var(--font-size-ui); }
  .call-error[hidden] { display: none; }
  .call-meta { margin: 0; display: flex; gap: var(--sp-4); flex-wrap: wrap; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-placeholder); min-height: 16px; }
  .call-note { margin: 0; font-size: 12px; color: var(--text-placeholder); text-align: center; }
</style>

<script>
(() => {
  const log = document.querySelector('[data-log]');
  const form = document.querySelector('[data-form]');
  const input = document.querySelector('[data-input]');
  const send = document.querySelector('[data-send]');
  const err = document.querySelector('[data-err]');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Minimal, safe markdown: escape first, then format the escaped string.
  function mdToHtml(s) {
    let h = escapeHtml(s);
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    h = h.replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return h.replace(/\n/g, '<br>');
  }

  const TYPING = '<span class="typing"><span></span><span></span><span></span></span>';

  function add(role, text, opts = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role + (opts.pending ? ' pending' : '');
    const inner = opts.typing ? TYPING : (opts.md ? mdToHtml(text) : escapeHtml(text));
    wrap.innerHTML = `<div class="bubble">${inner}</div>`;
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  // Grow the textarea with content.
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  // Enter sends; Shift+Enter newlines.
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    err.textContent = '';
    add('me', text);
    input.value = ''; input.style.height = 'auto';
    send.disabled = true;
    const pending = add('brain', '', { pending: true, typing: true });

    try {
      const r = await fetch('/api/voice/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      if (!r.ok) throw new Error('chat ' + r.status);
      const data = await r.json();
      pending.className = 'msg brain';
      pending.querySelector('.bubble').innerHTML = mdToHtml(data.reply || '(no reply)');
    } catch (e2) {
      pending.remove();
      err.textContent = 'Could not reach the brain (' + escapeHtml(e2.message) + ')';
    } finally {
      send.disabled = false;
      log.scrollTop = log.scrollHeight;
      input.focus();
    }
  });
})();
</script>

<script>
(() => {
  // Live call: one WebSocket to /api/voice/live (relayed to the Voice
  // service's /live). Mic and reply audio are PCM16 LE mono 24 kHz binary
  // frames, control is JSON text frames, per g-brain voice/CLAUDE.md.
  const RATE = 24000;
  const root = document.querySelector('[data-call]');
  const orb = root.querySelector('[data-orb]');
  const canvas = root.querySelector('[data-orb-canvas]');
  const stateEl = root.querySelector('[data-call-state]');
  const capUser = root.querySelector('[data-cap-user]');
  const capReply = root.querySelector('[data-cap-reply]');
  const callBtn = root.querySelector('[data-call-btn]');
  const callLabel = root.querySelector('[data-call-label]');
  const muteBtn = root.querySelector('[data-mute-btn]');
  const muteLabel = root.querySelector('[data-mute-label]');
  const sayForm = root.querySelector('[data-say-form]');
  const sayInput = root.querySelector('[data-say-input]');
  const sayBtn = root.querySelector('[data-say-btn]');
  const errBox = root.querySelector('[data-call-error]');
  const errText = root.querySelector('[data-call-error-text]');
  const metaEngine = root.querySelector('[data-meta-engine]');
  const metaTurn = root.querySelector('[data-meta-turn]');
  const log = document.querySelector('[data-log]');

  const LABELS = { idle: 'Not in a call', connecting: 'Calling', listening: 'Listening',
    hearing: 'Hearing you', thinking: 'Thinking', speaking: 'Speaking', error: 'Call ended' };

  // Capture: resample whatever the context runs at to 24 kHz, Int16, 40 ms chunks.
  const CAPTURE = `
  class Cap extends AudioWorkletProcessor {
    constructor() { super(); this.step = sampleRate / ${RATE}; this.pos = 0; this.prev = 0;
      this.out = new Int16Array(${RATE / 25}); this.n = 0; this.sq = 0; }
    process(inputs) {
      const ch = inputs[0] && inputs[0][0];
      if (!ch) return true;
      // Linear interpolation; pos is the read position into [prev, ...ch].
      while (this.pos < ch.length) {
        const i = Math.floor(this.pos), f = this.pos - i;
        const a = i === 0 ? this.prev : ch[i - 1], b = ch[i];
        const s = Math.max(-1, Math.min(1, a + (b - a) * f));
        this.out[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
        this.sq += s * s;
        if (this.n === this.out.length) {
          const buf = this.out.slice().buffer;
          this.port.postMessage({ pcm: buf, level: Math.sqrt(this.sq / this.n) }, [buf]);
          this.n = 0; this.sq = 0;
        }
        this.pos += this.step;
      }
      this.pos -= ch.length; this.prev = ch[ch.length - 1];
      return true;
    }
  }
  registerProcessor('cap', Cap);`;

  // Playback: a queue of float chunks tagged with their reply id. Counts what
  // has actually gone out per reply (reported every 250 ms), drops everything on flush, says when a
  // finished reply has drained.
  const PLAY = `
  class Play extends AudioWorkletProcessor {
    constructor() { super(); this.q = []; this.played = {}; this.sent = {}; this.done = {}; this.sq = 0; this.n = 0;
      this.port.onmessage = (e) => {
        const m = e.data;
        if (m.chunk) { this.q.push({ id: m.id, d: m.chunk, i: 0 }); this.played[m.id] = this.played[m.id] || 0; }
        else if (m.done !== undefined) { this.done[m.done] = true; this.check(m.done); }
        else if (m.flush !== undefined) {
          this.q = [];
          this.port.postMessage({ flushed: m.flush, samples: this.played[m.flush] || 0 });
          delete this.played[m.flush]; delete this.sent[m.flush]; delete this.done[m.flush];
        }
      }; }
    check(id) {
      if (this.done[id] && !this.q.some(c => c.id === id)) {
        this.port.postMessage({ drained: id, samples: this.played[id] || 0 });
        delete this.played[id]; delete this.sent[id]; delete this.done[id];
      }
    }
    process(_, outputs) {
      const out = outputs[0][0];
      let o = 0;
      while (o < out.length && this.q.length) {
        const c = this.q[0];
        const k = Math.min(out.length - o, c.d.length - c.i);
        out.set(c.d.subarray(c.i, c.i + k), o);
        for (let j = o; j < o + k; j++) this.sq += out[j] * out[j];
        o += k; c.i += k; this.played[c.id] = (this.played[c.id] || 0) + k;
        if (this.played[c.id] - (this.sent[c.id] || 0) >= sampleRate / 4) {
          this.sent[c.id] = this.played[c.id];
          this.port.postMessage({ progress: c.id, samples: this.played[c.id] });
        }
        if (c.i >= c.d.length) { this.q.shift(); this.check(c.id); }
      }
      this.n += out.length;
      if (this.n >= sampleRate / 20) { this.port.postMessage({ level: Math.sqrt(this.sq / this.n) }); this.n = 0; this.sq = 0; }
      return true;
    }
  }
  registerProcessor('play', Play);`;

  let ws = null, ctx = null, stream = null, capNode = null, playNode = null, sink = null;
  let state = 'idle', muted = false, replyId = null, capId = null, ending = false;
  let micLevel = 0, outLevel = 0, shown = 0, raf = 0;
  const playedMs = (n) => Math.round(n * 1000 / ctx.sampleRate);

  function setState(s) {
    state = s;
    root.dataset.state = s;
    stateEl.textContent = LABELS[s] || s;
    const live = s !== 'idle' && s !== 'error';
    callLabel.textContent = live ? 'End call' : 'Call';
    callBtn.querySelector('i').className = live ? 'ph ph-phone-x' : 'ph ph-phone';
    muteBtn.disabled = sayInput.disabled = sayBtn.disabled = !live || s === 'connecting';
    orb.disabled = s !== 'speaking';
    orb.setAttribute('aria-label', s === 'speaking' ? 'Stop the Voice' : 'Voice');
  }

  function showError(msg) {
    errText.textContent = msg;
    errBox.hidden = false;
  }

  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function bubble(role, text) {
    const w = document.createElement('div');
    w.className = 'msg ' + role;
    const b = document.createElement('div');
    b.className = 'bubble'; b.textContent = text;
    w.appendChild(b); log.appendChild(w); log.scrollTop = log.scrollHeight;
  }

  // Server audio is 24 kHz; the context may not be (some Safari builds ignore
  // the requested rate), so stretch it to the context rate here.
  function toFloat(buf) {
    const pcm = new Int16Array(buf);
    const ratio = ctx.sampleRate / RATE;
    const out = new Float32Array(Math.round(pcm.length * ratio));
    for (let i = 0; i < out.length; i++) {
      const x = i / ratio, j = Math.floor(x), f = x - j;
      const a = pcm[j] || 0, b = pcm[Math.min(j + 1, pcm.length - 1)] || 0;
      out[i] = (a + (b - a) * f) / 0x8000;
    }
    return out;
  }

  function onEvent(m) {
    switch (m.type) {
      case 'ready':
        metaEngine.textContent = [m.engine, m.model, m.voice].filter(Boolean).join(' ');
        break;
      case 'state':
        setState(m.state);
        if (m.state === 'hearing') { capUser.textContent = ''; }
        break;
      case 'reply':
        replyId = m.id;
        break;
      case 'reply_done':
        playNode.port.postMessage({ done: m.id });
        break;
      case 'flush':
        playNode.port.postMessage({ flush: m.id });
        break;
      case 'user':
        capUser.textContent = m.text; bubble('me', m.text);
        break;
      case 'assistant':
        // A cut reply's final (what was heard) can land after the next reply began.
        if (capId !== null && m.id < capId) { if (m.final && m.text) bubble('brain', m.text); break; }
        // Words can arrive before the reply's audio, so a new id starts the caption.
        if (m.id !== capId) { capId = m.id; capReply.textContent = ''; }
        if (m.final) { capReply.textContent = m.text; if (m.text) bubble('brain', m.text); }
        else capReply.textContent += m.text;
        break;
      case 'tool':
        if (m.status === 'start') stateEl.textContent = 'Looking it up';
        break;
      case 'metrics': {
        const parts = [];
        if (m.eos_ms != null) parts.push(`end of speech to audio ${Math.round(m.eos_ms)} ms`);
        if (m.ttfa_ms != null) parts.push(`model to audio ${Math.round(m.ttfa_ms)} ms`);
        if (m.cost != null) parts.push(`$${Number(m.cost).toFixed(4)}`);
        metaTurn.textContent = parts.join(', ');
        break;
      }
      case 'error':
        showError(m.message || 'The Voice hit a problem.');
        break;
    }
  }

  async function start() {
    errBox.hidden = true; ending = false; capId = null;
    capUser.textContent = ''; capReply.textContent = '';
    setState('connecting');
    try {
      if (!ctx) {
        try { ctx = new AudioContext({ sampleRate: RATE, latencyHint: 'interactive' }); }
        catch (_) { ctx = new AudioContext({ latencyHint: 'interactive' }); }
        const url = (src) => URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        await ctx.audioWorklet.addModule(url(CAPTURE));
        await ctx.audioWorklet.addModule(url(PLAY));
        playNode = new AudioWorkletNode(ctx, 'play', { numberOfInputs: 0, outputChannelCount: [1] });
        // Out through a media element: Chrome's echo canceller is most reliable
        // on audio it can see leaving through one.
        const dest = ctx.createMediaStreamDestination();
        playNode.connect(dest);
        sink = new Audio(); sink.srcObject = dest.stream; sink.autoplay = true;
        playNode.port.onmessage = (e) => {
          const m = e.data;
          if (m.level !== undefined) outLevel = m.level;
          else if (m.progress !== undefined) send({ type: 'played', id: m.progress, ms: playedMs(m.samples), done: false });
          else if (m.flushed !== undefined) send({ type: 'played', id: m.flushed, ms: playedMs(m.samples), done: false });
          else if (m.drained !== undefined) send({ type: 'played', id: m.drained, ms: playedMs(m.samples), done: true });
        };
      }
      await ctx.resume();
      sink.play().catch(() => {});
      stream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
      const src = ctx.createMediaStreamSource(stream);
      capNode = new AudioWorkletNode(ctx, 'cap', { numberOfOutputs: 0 });
      src.connect(capNode);
      capNode.port.onmessage = (e) => {
        micLevel = muted ? 0 : e.data.level;
        if (ws && ws.readyState === 1) ws.send(e.data.pcm);
      };
    } catch (e) {
      stopAudio();
      setState('error');
      showError(e && e.name === 'NotAllowedError'
        ? 'The browser blocked the microphone. Allow it for this site, then call again.'
        : 'Could not start the microphone. Check one is connected, then call again.');
      return;
    }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/api/voice/live`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => send({ type: 'hello', client: 'web', session: 'talk' });
    ws.onmessage = (e) => {
      if (typeof e.data === 'string') {
        try { onEvent(JSON.parse(e.data)); } catch (_) {}
      } else if (replyId !== null) {
        playNode.port.postMessage({ id: replyId, chunk: toFloat(e.data) });
      }
    };
    ws.onclose = (e) => {
      ws = null;
      stopAudio();
      if (ending) { setState('idle'); return; }
      setState('error');
      if (errBox.hidden) showError(e.code === 4401
        ? 'You are signed out. Sign in again, then call.'
        : 'The call dropped.');
    };
    if (!raf) raf = requestAnimationFrame(draw);
  }

  function stopAudio() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (capNode) { capNode.disconnect(); capNode = null; }
    if (playNode && replyId !== null) playNode.port.postMessage({ flush: replyId });
    replyId = null; micLevel = outLevel = 0;
    muted = false; muteBtn.setAttribute('aria-pressed', 'false'); muteLabel.textContent = 'Mute';
  }

  function end() {
    ending = true;
    send({ type: 'bye' });
    if (ws) ws.close(1000);
    else { stopAudio(); setState('idle'); }
  }

  callBtn.addEventListener('click', () => (state === 'idle' || state === 'error') ? start() : end());
  root.querySelector('[data-retry]').addEventListener('click', start);
  orb.addEventListener('click', () => { if (state === 'speaking') send({ type: 'interrupt' }); });
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    if (stream) stream.getAudioTracks().forEach(t => { t.enabled = !muted; });
    send({ type: 'mute', on: muted });
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteLabel.textContent = muted ? 'Unmute' : 'Mute';
  });
  sayForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const t = sayInput.value.trim();
    if (!t || !ws) return;
    sayInput.value = '';
    send({ type: 'say', text: t });
  });
  addEventListener('pagehide', () => { if (ws) end(); });

  // The circle: a ring that swells with the mic while you talk and with the
  // Voice while it speaks, eased so it breathes rather than jitters.
  const g = canvas.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  function draw() {
    const dpr = devicePixelRatio || 1, size = 160;
    if (canvas.width !== size * dpr) { canvas.width = canvas.height = size * dpr; }
    const live = state !== 'idle' && state !== 'error';
    const target = !live ? 0 : state === 'speaking' ? outLevel : (state === 'thinking' ? 0.02 : micLevel);
    const k = target > shown ? 0.25 : 0.08;
    shown += (Math.min(target * 4, 1) - shown) * k;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, size, size);
    const r = 44 + shown * 30;
    const tone = state === 'speaking' ? '--accent-fill' : live ? '--text-secondary' : '--border';
    g.beginPath(); g.arc(80, 80, r, 0, Math.PI * 2);
