<div class="page-head">
  <div class="page-head-text">
    <div class="row-tight">
      <h1 class="sr-only">Calendar</h1>
      <span class="badge badge-plain num" data-count>Loading</span>
    </div>
  </div>
  <div class="page-actions">
    <div class="g-segmented" role="radiogroup" aria-label="View">
      <label><input type="radio" name="view" value="list" checked>List</label>
      <label><input type="radio" name="view" value="month">Month</label>
    </div>
    <button class="btn btn-primary btn-sm" type="button" data-toggle-add aria-expanded="false" aria-label="Add item">
      <i class="ph ph-plus"></i><span>Add item</span>
    </button>
  </div>
</div>

<section class="card add-card" data-add-card hidden>
  <form class="add-form" data-add-form>
    <label class="field f-title">
      <span class="label">Title</span>
      <input class="input" type="text" name="title" required autocomplete="off">
    </label>
    <label class="field f-date">
      <span class="label">Date</span>
      <input class="input num" type="date" name="date" required>
    </label>
    <label class="field f-time">
      <span class="label">Time</span>
      <input class="input num" type="time" name="time">
    </label>
    <label class="field f-cat">
      <span class="label">Category</span>
      <span class="select-wrap">
        <select class="select" name="category">
          <option value="">None</option>
          <option value="work">Work</option>
          <option value="finance">Finance</option>
          <option value="social">Social</option>
          <option value="health">Health</option>
          <option value="errand">Errand</option>
          <option value="travel">Travel</option>
          <option value="personal">Personal</option>
        </select>
      </span>
    </label>
    <div class="f-actions">
      <button class="btn btn-primary" type="submit" data-submit>
        <span class="spinner"></span><span>Add item</span>
      </button>
    </div>
    <label class="field f-details">
      <span class="label">Details (optional)</span>
      <textarea class="textarea" name="body" rows="2" placeholder="Booking ref, address, who it's with"></textarea>
    </label>
  </form>
</section>

<div class="card cal-card">
  <div class="agenda" data-list>
    <div class="cal-skel" aria-hidden="true">
      <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span>
    </div>
  </div>

  <div class="month" data-month hidden>
    <div class="month-nav">
      <button class="btn btn-tertiary btn-sm btn-icon" type="button" data-step="-1" aria-label="Previous month">
        <i class="ph ph-caret-left"></i>
      </button>
      <span class="month-label num" data-month-label></span>
      <button class="btn btn-tertiary btn-sm btn-icon" type="button" data-step="1" aria-label="Next month">
        <i class="ph ph-caret-right"></i>
      </button>
      <button class="btn btn-secondary btn-sm" type="button" data-today>Today</button>
    </div>
    <div class="weekdays" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span>
      <span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="grid" data-grid></div>
    <div class="agenda month-day" data-month-day></div>
  </div>
</div>

<style>
  .add-card { margin-bottom: var(--sp-4); }
  .add-form {
    display: grid; gap: var(--sp-3); align-items: end;
    grid-template-columns: minmax(0, 1fr) 152px 112px 144px auto;
  }
  @media (max-width: 900px) {
    .add-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .add-form .f-title, .add-form .f-actions { grid-column: 1 / -1; }
  }
  .add-form .f-details { grid-column: 1 / -1; }
  @media (min-width: 901px) { .add-form .f-details { grid-row: 2; } }

  /* The list: Overdue, Today, Tomorrow, This week, Later. Each row is a tick,
     the when, the title and a move button, on a fixed grid so the titles line
     up down the page. */
  .agenda .sec + .sec { margin-top: var(--sp-5); }
  .agenda h2 {
    display: flex; align-items: center; gap: var(--sp-2);
    margin: 0 0 var(--sp-1); font-size: 12px; line-height: var(--lh-1); font-weight: 500;
    color: var(--text-secondary);
  }
  .agenda .sec-overdue h2 { color: var(--danger-text); }
  .row {
    display: grid; grid-template-columns: var(--h-1) 120px minmax(0, 1fr) var(--h-1);
    gap: var(--sp-3); align-items: center;
    min-height: var(--h-4); border-top: 1px solid var(--border-subtle);
  }
  .sec h2 + .row { border-top: 0; }
  .row .when { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .title { min-width: 0; display: flex; align-items: center; gap: var(--sp-2); }
  .row .title a {
    color: var(--text-primary); text-decoration: none; font-size: 14px; line-height: var(--lh-2);
    overflow-wrap: anywhere;
  }
  .row .title a:hover { text-decoration: underline; }
  .row .title .open {
    all: unset; cursor: pointer; color: var(--text-primary); font-size: 14px; line-height: var(--lh-2);
    overflow-wrap: anywhere;
  }
  .row .title .open:hover { text-decoration: underline; }
  /* The title is the row's open control: padded either side so its text
     sits inside its box, pulled back by the same so nothing moves. */
  .row .title .open { padding: 0 var(--sp-1); margin: 0 calc(-1 * var(--sp-1)); }
  .row .title .open:focus-visible { outline: 2px solid var(--accent-edge, var(--text-primary)); outline-offset: 2px; border-radius: var(--radius-sm); }
  .row.is-done .title .open { color: var(--ok-text); text-decoration: line-through; }
  .row.is-failed .title .open { color: var(--danger-text); text-decoration: line-through; }

  /* Details open in place under their row, lined up with the title column.
     They arrive by a mask wiping down, never a fade. */
  .details {
    margin: 0 0 var(--sp-3) calc(var(--h-1) + 120px + 2 * var(--sp-3));
    padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-sm); background: var(--surface-2);
    display: grid; gap: var(--sp-3); animation: cal-wipe var(--dur-base, 200ms) var(--ease-out, ease-out);
  }
  @keyframes cal-wipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @media (prefers-reduced-motion: reduce) { .details { animation: none; } }
  .details dl { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--sp-1) var(--sp-3); margin: 0; }
  .details dt { color: var(--text-secondary); font-size: 12px; line-height: var(--lh-2); }
  .details dd { margin: 0; font-size: 13px; line-height: var(--lh-2); overflow-wrap: anywhere; }
  .details .body { margin: 0; font-size: 13px; line-height: var(--lh-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  .details .body a { color: var(--accent-edge, var(--text-primary)); }
  .details .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
  .details .muted { color: var(--text-placeholder); font-size: 13px; margin: 0; }
  .edit-form { display: grid; gap: var(--sp-3); grid-template-columns: 152px 112px minmax(0, 1fr) 112px; align-items: end; }
  .edit-form .f-wide { grid-column: 1 / -1; }
  @media (max-width: 900px) { .edit-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .row .dot { flex: none; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--cat, var(--chart-6)); }
  .row .late { color: var(--warn-text); font-size: 12px; white-space: nowrap; }
  .row .vital-mark { color: var(--danger-text); font-weight: 500; }
  .row.is-done .title a { color: var(--ok-text); text-decoration: line-through; }
  .row.is-failed .title a { color: var(--danger-text); text-decoration: line-through; }
  .row .move { position: relative; }
  /* The date input stays in the layout under its button so showPicker()
     anchors the native picker to the row, but it is never seen. */
  .row .move input { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }
  .agenda .empty { color: var(--text-placeholder); font-size: 13px; margin: 0; }
  /* Held while the feed loads, so the card keeps a body instead of collapsing. */
  .cal-error { display: grid; justify-items: center; align-content: start; gap: var(--sp-3); padding: var(--sp-5) 0; }
  .cal-error p { margin: 0; color: var(--text-secondary); font-size: var(--font-size-ui); line-height: var(--lh-2); text-align: center; }
  .cal-skel { display: grid; gap: var(--sp-4); padding: var(--sp-3) 0; }
  .cal-skel .skeleton { height: var(--lh-2); width: 72%; }
  .cal-skel .skeleton:nth-child(2) { width: 56%; }
  .cal-skel .skeleton:nth-child(3) { width: 64%; }

  /* Wider than a phone the tick's hit box and the location line are not
     drawn: the row is the desktop grid above. */
  .row .tick-hit { display: contents; }
  .row .meta, .details .move-detail { display: none; }

  /* The phone list reads like a calendar app: a day per section under a
     header that sticks while its day scrolls, then one row per item, the
     time in a fixed column on the left, the title beside it wrapping under
     itself, and the location as one quiet line when there is one. The tick
     sits on the right under the thumb; moving lives in the open details. */
  /* At the narrowest phones Add is its icon alone (it keeps its label for
     screen readers), so the due count is never cut. */
  @media (max-width: 360px) { [data-toggle-add] span { display: none; } }

  @media (max-width: 720px) {
    .cal-card { padding: 0; border: 0; background: none; box-shadow: none; }
    .agenda .sec + .sec { margin-top: 0; }
    .agenda h2 {
      position: sticky; top: 0; z-index: 1; margin: 0;
      padding: var(--sp-4) 0 var(--sp-2); background: var(--bg);
      font-size: var(--font-size-ui); line-height: var(--lh-2); color: var(--text-primary);
      border-bottom: 1px solid var(--border-subtle);
    }
    .agenda h2 .sub { color: var(--text-secondary); font-weight: 400; }
    .agenda h2 .badge { display: none; }
    .row {
      position: relative;
      grid-template-columns: var(--h-5) minmax(0, 1fr) var(--h-5);
      column-gap: var(--sp-3); align-items: start;
      min-height: var(--h-5); padding: var(--sp-3) 0; border-top: 0;
    }
    .row + .row::before {
      content: ""; position: absolute; top: 0; right: 0;
      left: calc(var(--h-5) + var(--sp-3)); border-top: 1px solid var(--border-subtle);
    }
    .row .when {
      grid-column: 1; grid-row: 1; font-size: var(--font-size-ui); line-height: var(--lh-2);
      color: var(--text-primary);
    }
    .row .when.all-day { font-size: 12px; color: var(--text-secondary); white-space: normal; }
    .row .title { grid-column: 2; grid-row: 1; display: flex; flex-wrap: wrap; gap: 0 var(--sp-2); }
    .row .title .dot { display: none; }
    .row .title .open { flex: 1 0 100%; font-size: var(--font-size-body); line-height: var(--lh-2); }
    .row .title .open:hover { text-decoration: none; }
    /* A tap anywhere on the time, title or location opens the item; only
       the tick's column is left to the tick. */
    .row .title .open::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0;
      right: calc(var(--h-5) + var(--sp-3));
    }
    .row .late, .row .meta { font-size: 12px; line-height: var(--lh-1); }
    .row .meta {
      display: block; flex: 1 1 0; min-width: 0; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .move, .row > span:empty { display: none; }
    .row .tick-hit {
      grid-column: 3; grid-row: 1; display: flex; align-items: center; justify-content: flex-end;
      height: calc(var(--lh-2) + 2 * var(--sp-3)); margin: calc(-1 * var(--sp-3)) 0; cursor: pointer;
    }
    .details { margin: 0 0 var(--sp-3) calc(var(--h-5) + var(--sp-3)); padding: var(--sp-3); }
    .details .move-detail { display: inline-flex; position: relative; }
    .details .move-detail input { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }

    /* Now: a hairline across the title column between what has happened
       today and what has not, the time in the time column. */
    .now-line {
      display: grid; grid-template-columns: var(--h-5) minmax(0, 1fr); column-gap: var(--sp-3);
      align-items: center; height: var(--lh-1);
      font-size: 12px; line-height: var(--lh-1); font-weight: 500; color: var(--text-primary);
    }
    .now-line::after { content: ""; border-top: 1px solid var(--text-primary); }
  }

  .month-nav { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
  .month-label { min-width: 132px; text-align: center; font-size: var(--font-size-ui); }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--sp-2); }
  .weekdays { margin-bottom: var(--sp-2); color: var(--text-secondary); font-size: 11px; }
  .day {
    min-height: 88px; padding: var(--sp-2); min-width: 0; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
    display: flex; flex-direction: column; gap: var(--sp-1);
    text-align: left; cursor: pointer; font: inherit; color: inherit;
  }
  .day:hover { border-color: var(--text-secondary); }
  .day[aria-pressed="true"] { border-color: var(--accent-edge, var(--text-primary)); }
  .day.outside { opacity: 0.45; }
  .day .n { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .day.today .n { color: var(--text-primary); font-weight: 500; }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: var(--lh-1); min-width: 0; }
  .chip .label { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chip .dot { flex: none; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--cat, var(--chart-6)); }
  .chip.more { color: var(--text-secondary); padding-left: 12px; }
  .chip.is-done .label { color: var(--ok-text); text-decoration: line-through; }
  .month-day { margin-top: var(--sp-5); }
  @media (max-width: 900px) {
    .day { min-height: 56px; padding: var(--sp-1); }
    .chip .label, .chip.more { display: none; }
    .day .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  }
</style>

<script>
(async () => {
  const API_BASE = window.BRAIN_API;

  // Categories map onto the chart ramp so a colour means the same thing on
  // every surface that reads the brain.
  const CAT_COLOR = {
    study: 'var(--chart-1)', deadline: 'var(--chart-1)',
    finance: 'var(--chart-2)', bill: 'var(--chart-2)',
    family: 'var(--chart-3)', social: 'var(--chart-3)',
    health: 'var(--chart-4)', chore: 'var(--chart-4)',
    work: 'var(--chart-5)',
    travel: 'var(--chart-6)', errand: 'var(--chart-6)', personal: 'var(--chart-6)',
  };
  const MONTHS = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
  const LATER_DAYS = 35;

  const $ = (s) => document.querySelector(s);
  const listEl = $('[data-list]'), monthEl = $('[data-month]'), grid = $('[data-grid]');
  const monthDay = $('[data-month-day]'), monthLabel = $('[data-month-label]'), count = $('[data-count]');

  const plain = (s) => (window.g && g.plain ? g.plain(s) : String(s || ''));
  const esc = (s) => plain(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays = (d, n) => { const c = new Date(d); c.setDate(c.getDate() + n); return c; };
  const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
  const TODAY = iso(new Date());
  const on = (n) => iso(addDays(new Date(), n));
  const short = (key) => new Date(key + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  let view = new URLSearchParams(location.search).get('view') === 'month' ? 'month' : 'list';
  let cursor = new Date(); cursor.setDate(1);
  let selected = TODAY;
  let items = [];   // every occurrence fetched, the index is the row's handle
  // A link from elsewhere (Home's panels, Jobs) names one item as
  // ?item=<slug>&date=<day>, and it opens with its details showing.
  const asked = new URLSearchParams(location.search);
  let deep = asked.get('item') ? { slug: asked.get('item'), date: asked.get('date') || '' } : null;

  // A habit that happens every day is not a deadline: past today it would
  // fill every section with the one thing you already know. Bills and vital
  // ones still show, since those are the dates that matter.
  const routine = (it) => it.recurring && !it.vital && !it.urgent && !['finance', 'bill'].includes(it.category);
  const byClock = (a, b) => (a.date || '').localeCompare(b.date || '')
    || (!!b.time - !!a.time) || (a.time || '').localeCompare(b.time || '')
    || plain(a.title).localeCompare(plain(b.title));
  const settledLast = (a, b) => (!!(a.done || a.failed) - !!(b.done || b.failed)) || byClock(a, b);

  function row(it, whenText) {
    const i = items.indexOf(it);
    const state = it.done ? ' is-done' : it.failed ? ' is-failed' : '';
    const late = it.late_days ? `<span class="late">${it.late_days === 1 ? '1 day late' : it.late_days + ' days late'}</span>` : '';
    // A recurring item moves as a series, never one occurrence, so it has no
    // move button; skipping a day is the tick's job.
    const move = it.recurring || it.done ? '' : `
      <span class="move">
        <button class="btn btn-tertiary btn-sm btn-icon" type="button" data-act="move" data-i="${i}"
                data-tip="Move to another date" aria-label="Move ${esc(it.title)}"><i class="ph ph-calendar-dots"></i></button>
        <input type="date" tabindex="-1" aria-hidden="true" data-move="${i}" value="${esc(it.date)}" min="${TODAY}">
      </span>`;
    // The location line is drawn on phones only; it is plain text, never a link.
    const meta = it.location ? `<span class="meta">${esc(it.location)}</span>` : '';
    const allDay = phone() && !it.time ? ' all-day' : '';
    return `
      <div class="row${state}" style="--cat:${CAT_COLOR[it.category] || 'var(--chart-6)'}">
        <label class="tick-hit"><input class="checkbox tick" type="checkbox" data-act="tick" data-i="${i}" ${it.done ? 'checked' : ''}
               aria-label="${it.done ? 'Mark not done' : 'Mark done'}: ${esc(it.title)}"></label>
        <span class="when${allDay}">${whenText}</span>
        <span class="title"><span class="dot"></span>
          <button class="open" type="button" data-act="open" data-i="${i}" aria-expanded="${openKey === keyOf(it)}">${it.vital ? '<span class="vital-mark">!</span> ' : ''}${esc(it.title)}</button>${late}${meta}</span>
        ${move || '<span></span>'}
      </div>${openKey === keyOf(it) ? `<div class="details" data-details="${i}">${detailsHtml(it)}</div>` : ''}`;
  }

  // Details: one item open at a time, keyed by slug and date so the right
  // occurrence stays open across a reload. The calendar feed carries no body
  // or amount, so the full todo is fetched when it opens.
  let openKey = null, editing = false;
  const full = {};   // slug -> the full todo, or {error}
  const keyOf = (it) => `${it.slug}@${it.date}`;
  const raw = (s) => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const linkify = (s) => raw(s).replace(/https?:\/\/[^\s<]+[^\s<.,:;)\]'"!?]/g,
    (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const money = (a) => {
    const n = Number(a);
    return a === '' || a == null ? '' : Number.isFinite(n) ? `£${n.toFixed(2)}` : String(a);
  };
  const startOf = (t) => {   // {date, time} from the stored start or due
    const s = t.start ? String(t.start) : '';
    if (s.includes('T')) return { date: s.slice(0, 10), time: t.all_day ? '' : s.slice(11, 16) };
    return { date: String(t.due || s || '').slice(0, 10), time: '' };
  };

  function detailsHtml(it) {
    const t = full[it.slug];
    if (!t) return '<p class="muted">Loading details</p>';
    if (t.error) return `<p class="muted">Details unavailable: the brain did not answer. Close and open it to try again.</p>`;
    const i = items.indexOf(it);
    const note = `<a class="btn btn-tertiary btn-sm" href="/note/todos/${esc(it.slug)}">Open note</a>`;
    if (editing) {
      const s = startOf(t);
      return `<form class="edit-form" data-edit="${i}">
        ${it.recurring ? '' : `<label class="field"><span class="label">Date</span>
          <input class="input num" type="date" name="date" value="${raw(s.date || it.date)}" required></label>`}
        <label class="field"><span class="label">Time</span>
          <input class="input num" type="time" name="time" value="${raw(s.time)}"></label>
        <label class="field"><span class="label">Location</span>
          <input class="input" type="text" name="location" value="${raw(t.location || '')}" autocomplete="off"></label>
        <label class="field"><span class="label">Amount</span>
          <input class="input num" type="text" inputmode="decimal" name="amount" value="${raw(t.amount ?? '')}" autocomplete="off"></label>
        <label class="field f-wide"><span class="label">Details</span>
          <textarea class="textarea" name="body" rows="4">${raw((t.body || '').trimEnd())}</textarea></label>
        <div class="actions f-wide">
          <button class="btn btn-primary btn-sm" type="submit"><span class="spinner"></span><span>Save details</span></button>
          <button class="btn btn-tertiary btn-sm" type="button" data-act="cancel" data-i="${i}">Cancel</button>
        </div>
      </form>`;
    }
    const when = it.time ? `${short(it.date)} at ${it.time}` : `${short(it.date)}, all day`;
    const rows = [['When', raw(when) + (it.recurring ? ', repeats' : '')],
                  ['Where', t.location ? linkify(t.location) : ''],
                  ['Amount', raw(money(t.amount))]]
      .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    const body = (t.body || '').trim();
    // On a phone the row has no move button, so moving is here, next to edit.
    const move = it.recurring || it.done ? '' : `<span class="move-detail">
        <button class="btn btn-secondary btn-sm" type="button" data-act="move" data-i="${i}">Move</button>
        <input type="date" tabindex="-1" aria-hidden="true" data-move="${i}" value="${esc(it.date)}" min="${TODAY}"></span>`;
    return `<dl>${rows}</dl>${body ? `<p class="body">${linkify(body)}</p>` : ''}
      <div class="actions">
        <button class="btn btn-secondary btn-sm" type="button" data-act="edit" data-i="${i}">Edit details</button>${move}${note}
      </div>`;
  }

  function repaintDetails() {
    const box = document.querySelector('[data-details]');
    const it = box && items[Number(box.dataset.details)];
    if (it) box.innerHTML = detailsHtml(it);
  }

  async function fetchFull(slug) {
    try {
      const r = await fetch(`${API_BASE}/api/todos/${encodeURIComponent(slug)}`);
      if (!r.ok) throw new Error(`status ${r.status}`);
      full[slug] = await r.json();
    } catch (e) {
      full[slug] = { error: e.message };
    }
    repaintDetails();
  }

  function section(key, title, rows, whenOf) {
    if (!rows.length) return '';
    return `<section class="sec sec-${key}"><h2>${title}<span class="badge badge-plain num">${rows.length}</span></h2>
      ${rows.map(it => row(it, whenOf(it))).join('')}</section>`;
  }

  function renderList() {
    const live = items.filter(it => !it.dropped);
    const time = (it) => it.time ? esc(it.time) : '';
    const dated = (it) => esc(short(it.date)) + (it.time ? ' ' + esc(it.time) : '');
    const inRange = (a, b) => live.filter(it => it.date >= a && it.date <= b && !routine(it)).sort(byClock);
    const overdue = live.filter(it => it.date === TODAY && it.late_days && !it.done).sort(byClock);
    // Late work ticked off has gone; what was due today stays, struck, so a
    // habit ticked by mistake can be unticked.
    const today = live.filter(it => it.date === TODAY && !overdue.includes(it)
                                    && !(it.late_days && (it.done || it.failed))).sort(settledLast);
    if (phone()) { listEl.innerHTML = phoneList(live, overdue, today) || '<p class="empty">Nothing dated in the next five weeks.</p>'; return; }
    const html =
      section('overdue', 'Overdue', overdue, time) +
      section('today', 'Today', today, time) +
      section('tomorrow', 'Tomorrow', inRange(on(1), on(1)), time) +
      section('week', 'This week', inRange(on(2), on(7)), dated) +
      section('later', 'Later', inRange(on(8), on(LATER_DAYS)), dated);
    listEl.innerHTML = html || '<p class="empty">Nothing dated in the next five weeks.</p>';
  }

  // Phones get a day per section (Today, Tomorrow, then weekday and date),
  // all-day items first, then by the clock, done ones struck in place.
  const PHONE = window.matchMedia('(max-width: 720px)');
  const phone = () => PHONE.matches;
  const allDayFirst = (a, b) => (!!a.time - !!b.time) || (a.time || '').localeCompare(b.time || '')
    || plain(a.title).localeCompare(plain(b.title));
  const clockNow = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  const phoneWhen = (it) => it.time ? esc(it.time) : 'All day';

  function daySection(key, label, sub, rows, withNow) {
    if (!rows.length) return '';
    let body = rows.map(it => row(it, phoneWhen(it)));
    if (withNow && rows.some(it => it.time)) {
      const now = clockNow();
      const next = rows.findIndex(it => it.time && it.time > now);
      const at = next === -1 ? rows.length : next;
      // Before the first timed item there is nothing to divide: the line
      // only shows once part of the day has gone.
      if (rows.slice(0, at).some(it => it.time)) {
        body.splice(at, 0, `<div class="now-line" role="note" aria-label="Now, ${now}"><span class="num">${now}</span></div>`);
      }
    }
    return `<section class="sec sec-${key}"><h2>${label}${sub ? `<span class="sub">${sub}</span>` : ''}</h2>${body.join('')}</section>`;
  }

  function phoneList(live, overdue, today) {
    const head = (key) => new Date(key + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long' });
    const date = (key) => new Date(key + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    let html = daySection('overdue', 'Overdue', '', overdue.slice().sort(allDayFirst), false)
      + daySection('today', 'Today', esc(short(TODAY)), today.slice().sort(allDayFirst), true);
    for (let n = 1; n <= LATER_DAYS; n++) {
      const key = on(n);
      const rows = live.filter(it => it.date === key && !routine(it)).sort(allDayFirst);
      html += daySection(n === 1 ? 'tomorrow' : 'day', n === 1 ? 'Tomorrow' : esc(head(key)),
                         n === 1 ? esc(short(key)) : esc(date(key)), rows, false);
    }
    return html;
  }
  PHONE.addEventListener('change', () => { if (view === 'list') paint(); });

  function renderMonth() {
    const start = mondayOf(new Date(cursor.getFullYear(), cursor.getMonth(), 1));
    monthLabel.textContent = `${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}`;
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = addDays(start, i), key = iso(d);
      const day = items.filter(it => it.date === key && !it.dropped && !routine(it));
      const chips = day.slice(0, 3).map(it => `
        <span class="chip${it.done ? ' is-done' : ''}" style="--cat:${CAT_COLOR[it.category] || 'var(--chart-6)'}">
          <span class="dot"></span><span class="label">${esc(it.title)}</span></span>`).join('');
      const extra = day.length - Math.min(day.length, 3);
      cells.push(`
        <button type="button" class="day${d.getMonth() !== cursor.getMonth() ? ' outside' : ''}${key === TODAY ? ' today' : ''}"
                data-day="${key}" aria-pressed="${key === selected}">
          <span class="n">${d.getDate()}</span>
          <span class="chips">${chips}${extra ? `<span class="chip more">${extra} more</span>` : ''}</span>
        </button>`);
    }
    grid.innerHTML = cells.join('');
    const picked = items.filter(it => it.date === selected && !it.dropped).sort(settledLast);
    monthDay.innerHTML = section('day', selected === TODAY ? 'Today' : esc(short(selected)), picked,
      (it) => it.time ? esc(it.time) : '') || `<p class="empty">Nothing on ${esc(short(selected))}.</p>`;
  }

  function range() {
    if (view === 'list') return [new Date(), addDays(new Date(), LATER_DAYS)];
    const start = mondayOf(new Date(cursor.getFullYear(), cursor.getMonth(), 1));
    return [start, addDays(start, 41)];
  }

  function paint() {
    listEl.hidden = view !== 'list';
    monthEl.hidden = view !== 'month';
    if (view === 'list') renderList(); else renderMonth();
  }

  // Opens the linked item. A day outside the list's window is shown in its
  // month instead; that needs another load, so this returns false.
  function openDeep() {
    const it = items.find(x => x.slug === deep.slug && (!deep.date || x.date === deep.date))
            || items.find(x => x.slug === deep.slug);
    if (!it && deep.date && view === 'list') {
      view = 'month';
      cursor = new Date(deep.date + 'T12:00:00'); cursor.setDate(1);
      selected = deep.date;
      document.querySelectorAll('input[name="view"]').forEach(r => { r.checked = r.value === view; });
      return false;
    }
    deep = null;
    const url = new URL(location.href);
    url.searchParams.delete('item'); url.searchParams.delete('date');
    if (view === 'month') url.searchParams.set('view', 'month');
    history.replaceState(null, '', url);
    if (!it) return true;
    if (view === 'month') selected = it.date;
    openKey = keyOf(it); editing = false;
    fetchFull(it.slug);
    requestAnimationFrame(() => document.querySelector('[data-details]')
      ?.closest('.details')?.previousElementSibling?.scrollIntoView({ block: 'center' }));
    return true;
  }

  async function load() {
    const [start, end] = range();
    try {
      const r = await fetch(`${API_BASE}/api/todos/calendar?date_from=${iso(start)}&date_to=${iso(end)}`);
      if (!r.ok) throw new Error(`status ${r.status}`);
      items = await r.json();
      if (deep && !openDeep()) return load();
      paint();
      dueCount();
    } catch (e) {
      const msg = `<div class="cal-error"><p>Calendar unavailable: the brain did not answer.</p>
        <button class="btn btn-secondary btn-sm" type="button" data-retry>Try again</button></div>`;
      (view === 'list' ? listEl : monthDay).innerHTML = msg;
      count.textContent = 'Unavailable';
    }
  }

  // The head's count is the agenda's (core/panels/agenda.py counts), the same
  // one Home's agenda card and calendar panel use, so no two heads disagree.
  // Without the brain's agenda there is no count rather than a second rule.
  async function dueCount() {
    try {
      const r = await fetch('/api/panels/agenda', { credentials: 'same-origin' });
      const d = r.ok ? await r.json() : null;
      const n = d && d.due ? d.due.week : null;
      count.hidden = n == null;
      if (n != null) count.textContent = n ? `${n} due this week` : 'Nothing due this week';
    } catch (e) {
      count.hidden = true;
    }
  }

  async function patch(it, body, word) {
    const r = await fetch(`${API_BASE}/api/todos/${encodeURIComponent(it.slug)}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (!r.ok) {
      g.toast({ title: 'Not saved', desc: `The brain refused the change (${r.status}). The item is unchanged, try again.`, kind: 'danger' });
      await load();
      return;
    }
    await load();
    g.toast({ title: word, desc: plain(it.title), kind: 'ok' });
  }

  function tickBody(it) {
    if (it.recurring) return it.done ? { undone_date: it.date, unfailed_date: it.date } : { done_date: it.date };
    return { status: it.done ? 'open' : 'done' };
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-retry]')) { load(); return; }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const it = items[Number(el.dataset.i)];
    if (!it) return;
    if (el.dataset.act === 'open') {
      const k = keyOf(it);
      openKey = openKey === k ? null : k;
      editing = false;
      if (openKey) { delete full[it.slug]; fetchFull(it.slug); }
      paint();
    } else if (el.dataset.act === 'edit' || el.dataset.act === 'cancel') {
      editing = el.dataset.act === 'edit';
      repaintDetails();
      if (editing) document.querySelector('[data-edit] input, [data-edit] textarea')?.focus();
    } else if (el.dataset.act === 'tick') {
      el.disabled = true;
      patch(it, tickBody(it), it.done ? 'Marked not done' : 'Marked done');
    } else if (el.dataset.act === 'move') {
      const input = el.parentElement.querySelector('[data-move]');
      try { input.showPicker(); } catch { input.click(); }
    }
  });
  document.addEventListener('change', (e) => {
    const input = e.target.closest('[data-move]');
    if (!input || !input.value) return;
    const it = items[Number(input.dataset.move)];
    if (it && input.value !== it.date) patch(it, { reschedule_to: input.value }, `Moved to ${short(input.value)}`);
  });

  // Save: only the fields that changed go in the PATCH. A time sets start
  // (keeping any end the same length after it), no time makes it all day.
  document.addEventListener('submit', async (e) => {
    const f = e.target.closest('[data-edit]');
    if (!f) return;
    e.preventDefault();
    const it = items[Number(f.dataset.edit)], t = it && full[it.slug];
    if (!t || t.error) return;
    const fd = new FormData(f), was = startOf(t), body = {};
    const date = it.recurring ? was.date : String(fd.get('date') || '');
    const time = String(fd.get('time') || '');
    if (!date) {
      g.toast({ title: 'Date needed', desc: 'Every item has a date. Pick one, then save.', kind: 'danger' });
      return;
    }
    if (date !== was.date || time !== was.time) {
      if (time) {
        body.start = `${date}T${time}:00`;
        body.all_day = false;
        body.due = null;
        if (t.end && t.start && String(t.start).includes('T')) {
          const len = new Date(t.end) - new Date(t.start);
          const end = new Date(new Date(`${date}T${time}:00`).getTime() + len);
          body.end = `${iso(end)}T${String(end.getHours()).padStart(2,'0')}:${String(end.getMinutes()).padStart(2,'0')}:00`;
        }
      } else {
        body.due = date; body.start = null; body.end = null; body.all_day = true;
      }
    }
    const loc = String(fd.get('location') || '').trim();
    if (loc !== (t.location || '')) body.location = loc || null;
    const amt = String(fd.get('amount') || '').trim().replace(/^£/, '');
    if (amt !== String(t.amount ?? '')) body.amount = amt === '' ? null : (Number.isFinite(Number(amt)) ? Number(amt) : amt);
    const text = String(fd.get('body') || '').trimEnd();
    if (text !== (t.body || '').trimEnd()) body.body = text;
    if (!Object.keys(body).length) { editing = false; repaintDetails(); return; }
    f.querySelector('[type=submit]').setAttribute('data-loading', '');
    editing = false;
    if (!it.recurring) openKey = `${it.slug}@${date}`;
    delete full[it.slug];
    await patch(it, body, 'Details saved');
    await fetchFull(it.slug);
  });

  grid.addEventListener('click', (e) => {
    const cell = e.target.closest('[data-day]');
    if (!cell) return;
    selected = cell.dataset.day;
    renderMonth();
  });
  document.querySelectorAll('input[name="view"]').forEach((radio) => {
    radio.checked = radio.value === view;
    radio.addEventListener('change', () => {
      view = radio.value;
      const url = new URL(location.href);
      if (view === 'month') url.searchParams.set('view', 'month'); else url.searchParams.delete('view');
      history.replaceState(null, '', url);
      load();
    });
  });
  document.querySelectorAll('[data-step]').forEach(btn => btn.addEventListener('click', () => {
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + Number(btn.dataset.step), 1);
    load();
  }));
  $('[data-today]').addEventListener('click', () => {
    const now = new Date();
    cursor = new Date(now.getFullYear(), now.getMonth(), 1);
    selected = TODAY;
    load();
  });

  // Add: every item has a date. The time is optional; without one it is all day.
  const card = $('[data-add-card]'), form = $('[data-add-form]'), toggle = $('[data-toggle-add]');
  form.elements.date.value = TODAY;
  toggle.addEventListener('click', () => {
    card.hidden = !card.hidden;
    toggle.setAttribute('aria-expanded', String(!card.hidden));
    if (!card.hidden) form.elements.title.focus();
  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const title = String(fd.get('title') || '').trim();
    const date = String(fd.get('date') || '');
    const time = String(fd.get('time') || '');
    if (!title || !date) {
      g.toast({ title: 'Title and date needed', desc: 'Every item has a date. Fill both in, then add it.', kind: 'danger' });
      return;
    }
    const payload = { title, priority: 'P1', due: date, all_day: !time,
                      requester: 'gabriel', composer: 'gabriel', source: 'gcommand:calendar' };
    if (time) payload.start = `${date}T${time}`;
    if (fd.get('category')) payload.category = String(fd.get('category'));
    const details = String(fd.get('body') || '').trim();
    if (details) payload.body = details;
    const submit = $('[data-submit]');
    submit.setAttribute('data-loading', '');
    try {
      const r = await fetch(`${API_BASE}/api/todos`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      if (!r.ok) throw new Error(String(r.status));
      form.reset();
      form.elements.date.value = TODAY;
      g.toast({ title: 'Item added', desc: `${title}, ${short(date)}`, kind: 'ok' });
      await load();
    } catch (err) {
      g.toast({ title: 'Not added', desc: `The brain refused it (${err.message}). Nothing was saved, try again.`, kind: 'danger' });
    } finally {
      submit.removeAttribute('data-loading');
    }
  });

  await load();
})();
</script>
