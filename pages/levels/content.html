<div class="page-head">
  <div class="page-head-text">
    <div class="row-tight">
      <h1 class="sr-only">Levels</h1>
      <span class="badge badge-plain" data-lv-stamp>Loading</span>
    </div>
    <p class="page-sub">Gates check agent work, charters pin them, and every run leaves a result.</p>
  </div>
</div>

<script>
/* One fetch per page view. Panels register with LV.on(fn) and render from the same
   snapshot. LV.reload() refetches, which the taste panel calls after a grade. */
window.LV = (function () {
  const subs = [];
  let data = null;
  const api = {
    get data() { return data; },
    on(fn) { subs.push(fn); if (data) { try { fn(data); } catch (e) { console.error(e); } } },
    esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    },
    plain(s) { return (window.g && g.plain) ? g.plain(String(s == null ? "" : s)) : String(s == null ? "" : s); },
    pct(x, digits) { return x == null ? "-" : (x * 100).toFixed(digits == null ? 0 : digits) + "%"; },
    async reload() {
      const stamp = document.querySelector("[data-lv-stamp]");
      try {
        const r = await fetch("/api/levels/snapshot", { credentials: "same-origin" });
        if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname); return; }
        if (!r.ok) throw new Error(String(r.status));
        data = await r.json();
        if (stamp) stamp.textContent = (data.results.rows || 0) + " results logged";
        subs.forEach(fn => { try { fn(data); } catch (e) { console.error(e); } });
      } catch (e) {
        if (stamp) stamp.textContent = "Not loaded";
        document.querySelectorAll("[data-lv-loading]").forEach(el => {
          el.textContent = "The g-levels data did not load. Reload the page to try again.";
        });
      }
      return data;
    },
  };
  return api;
})();
</script>
