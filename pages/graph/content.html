<div class="page-head">
  <h1>Graph</h1>
  <span data-stats class="badge badge-plain">Loading</span>
  <span class="spacer"></span>
  <span class="legend" data-legend></span>
</div>
<p class="page-sub">Wikilinks between notes. Drag to orbit, scroll to zoom, hover for titles, click to open.</p>

<div class="card graph-wrap">
  <div data-graph class="graph-canvas" role="img" aria-label="Wikilink graph"></div>
</div>

<style>
  .page-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .page-head h1 { font-size: 18px; margin: 0; }
  .page-head .spacer { flex: 1; }
  .page-sub { margin: 6px 0 var(--sp-4); font-size: var(--font-size-ui); color: var(--text-secondary); }
  [data-stats] { font-variant-numeric: tabular-nums; }
  .legend { display: inline-flex; gap: var(--sp-3); flex-wrap: wrap; font-size: 12px; }
  .legend .swatch { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); }
  .legend .dot { width: 10px; height: 10px; border-radius: var(--radius-full); display: inline-block; }
  .graph-wrap { padding: 0; overflow: hidden; max-width: none; }
  .graph-canvas { height: calc(100vh - 220px); min-height: 420px; background: var(--surface-1); }
  .graph-canvas .msg { padding: var(--sp-5); color: var(--text-secondary); font-size: var(--font-size-ui); }
  .graph-canvas .scene-tooltip {
    font-family: var(--font-ui); font-size: 12px; color: var(--text-primary);
    background: var(--overlay-bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 3px 8px;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.79.0/dist/3d-force-graph.min.js"></script>
<script>
(async () => {
  const el = document.querySelector('[data-graph]');
  const stats = document.querySelector('[data-stats]');
  const legend = document.querySelector('[data-legend]');
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const fail = (msg) => { stats.textContent = 'Unavailable'; el.innerHTML = `<p class="msg">${msg}</p>`; };

  const webgl = (() => {
    try { const c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); }
    catch (e) { return false; }
  })();
  if (!webgl) return fail('This browser has no WebGL, so the 3D graph cannot draw.');
  if (typeof ForceGraph3D !== 'function') return fail('The 3D graph library did not load. Reload to try again.');

  /* WebGL needs concrete colours, not CSS vars: resolve the live theme's
     chart palette and grounds, and again on a theme flip. */
  const fallback = ['#2f6fe0', '#c2410c', '#4d8b3f', '#b7791f', '#7c4dbd', '#2a8a8a'];
  const probe = document.createElement('span');
  probe.hidden = true;
  document.body.appendChild(probe);
  const resolve = (name, fb) => {
    probe.style.color = '';
    probe.style.color = `var(${name})`;
    const v = getComputedStyle(probe).color;
    return v && v !== 'rgba(0, 0, 0, 0)' && getComputedStyle(document.documentElement).getPropertyValue(name).trim() ? v : fb;
  };
  const palette = () => [1, 2, 3, 4, 5, 6].map(i => resolve(`--chart-${i}`, fallback[i - 1]));

  try {
    const r = await fetch(BRAIN_API + '/api/graph');
    if (!r.ok) throw new Error(`graph ${r.status}`);
    const { nodes, links } = await r.json();
    stats.textContent = `${nodes.length} nodes, ${links.length} links`;

    const kinds = Array.from(new Set(nodes.map(n => n.kind))).sort();
    const slot = kind => kinds.indexOf(kind) % 6;
    legend.innerHTML = kinds.map(k =>
      `<span class="swatch"><span class="dot" style="background:var(--chart-${slot(k) + 1})"></span>${cap(k)}</span>`
    ).join('');

    // Size by link degree, counted before the library swaps ids for objects.
    const degree = {};
    links.forEach(l => {
      degree[l.source] = (degree[l.source] || 0) + 1;
      degree[l.target] = (degree[l.target] || 0) + 1;
    });
    nodes.forEach(n => { n.val = degree[n.id] || 1; });

    let colors = palette();
    let linkGrey = resolve('--text-placeholder', '#696e77');
    const label = n => `${window.g.plain(n.title)} · ${n.kind}${n.status === 'broken' ? ', broken' : ''}`;

    const graph = ForceGraph3D()(el)
      .width(el.clientWidth)
      .height(el.clientHeight)
      .backgroundColor(resolve('--surface-1', '#111113'))
      .showNavInfo(false)
      .nodeRelSize(4)
      .nodeLabel(label)
      .nodeColor(n => colors[slot(n.kind)])
      .linkColor(() => linkGrey)
      .linkOpacity(0.35)
      .onNodeClick(n => { window.location.href = `/note/${n.id}`; })
      .graphData({ nodes, links });

    try { graph.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); } catch (e) {}

    graph.controls().autoRotate = true;
    graph.controls().autoRotateSpeed = 0.5;
    el.addEventListener('pointerdown', () => { graph.controls().autoRotate = false; }, { once: true });

    new ResizeObserver(() => graph.width(el.clientWidth).height(el.clientHeight)).observe(el);

    new MutationObserver(() => {
      colors = palette();
      linkGrey = resolve('--text-placeholder', '#696e77');
      graph.backgroundColor(resolve('--surface-1', '#111113'))
        .nodeColor(n => colors[slot(n.kind)])
        .linkColor(() => linkGrey);
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) {
    fail(`The brain API did not answer (${e.message}). Reload to try again.`);
  }
})();
</script>
