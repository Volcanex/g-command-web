<div class="page-head">
  <h1>Graph</h1>
  <span data-stats class="badge badge-plain">Loading</span>
  <span class="spacer"></span>
  <span class="legend" data-legend></span>
</div>
<p class="page-sub">Wikilinks between notes. Drag nodes; hover for titles; click to open.</p>

<div class="card graph-wrap">
  <svg data-graph width="100%" height="640" role="img" aria-label="Wikilink graph"></svg>
</div>

<style>
  .page-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .page-head h1 { font-size: 18px; margin: 0; }
  .page-head .spacer { flex: 1; }
  .page-sub { margin: 6px 0 var(--sp-4); font-size: var(--font-size-ui); color: var(--text-secondary); }
  [data-stats] { font-variant-numeric: tabular-nums; }
  .legend { display: inline-flex; gap: var(--sp-3); flex-wrap: wrap; font-size: 12px; }
  .legend .swatch { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); }
  .legend .dot { width: 10px; height: 10px; border-radius: var(--radius-full); display: inline-block; }
  .graph-wrap { padding: 0; overflow: hidden; max-width: none; }
  svg[data-graph] { display: block; cursor: grab; }
  svg[data-graph]:active { cursor: grabbing; }
  svg[data-graph] .link { stroke: var(--text-placeholder); stroke-opacity: 0.35; stroke-width: 1; }
  svg[data-graph] .node { stroke: var(--card-bg); stroke-width: 1.5; cursor: pointer; }
  svg[data-graph] .node.broken { stroke-dasharray: 2 2; }
  svg[data-graph] .label {
    font-family: var(--font-ui); font-size: 10px; fill: var(--text-secondary);
    pointer-events: none; user-select: none;
  }
</style>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(async () => {
  const svgEl = document.querySelector('[data-graph]');
  const stats = document.querySelector('[data-stats]');
  const legend = document.querySelector('[data-legend]');

  /* The chart palette is derived at build time to clear contrast on both
     surfaces; read it live so theme flips recolour on reload. */
  const cs = getComputedStyle(document.documentElement);
  const palette = [1,2,3,4,5,6].map(i => (cs.getPropertyValue(`--chart-${i}`) || '').trim()).filter(Boolean);
  const fallback = ['#2f6fe0', '#c2410c', '#4d8b3f', '#b7791f', '#7c4dbd', '#2a8a8a'];
  const chartPalette = palette.length ? palette : fallback;
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

  try {
    const r = await fetch(BRAIN_API + '/api/graph');
    if (!r.ok) throw new Error(`graph ${r.status}`);
    const { nodes, links } = await r.json();
    stats.textContent = `${nodes.length} nodes, ${links.length} links`;

    const kinds = Array.from(new Set(nodes.map(n => n.kind))).sort();
    const color = kind => chartPalette[kinds.indexOf(kind) % chartPalette.length];

    legend.innerHTML = kinds.map(k =>
      `<span class="swatch"><span class="dot" style="background:${color(k)}"></span>${cap(k)}</span>`
    ).join('');

    const width = svgEl.clientWidth || 900;
    const height = +svgEl.getAttribute('height') || 640;
    const svg = d3.select(svgEl).attr('viewBox', `0 0 ${width} ${height}`);
    svg.selectAll('*').remove();

    const g = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', e => g.attr('transform', e.transform)));

    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(60).strength(0.6))
      .force('charge', d3.forceManyBody().strength(-160))
      .force('center', d3.forceCenter(width/2, height/2))
      .force('collide', d3.forceCollide().radius(12));

    const link = g.append('g').attr('class', 'links').selectAll('line')
      .data(links).enter().append('line').attr('class', 'link');

    const node = g.append('g').attr('class', 'nodes').selectAll('circle')
      .data(nodes).enter().append('circle')
      .attr('class', d => `node ${d.status === 'broken' ? 'broken' : ''}`)
      .attr('r', 6)
      .attr('fill', d => color(d.kind))
      .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }))
      .on('click', (_, d) => { window.location.href = `/note/${d.id}`; });

    node.append('title').text(d => `${window.g.plain(d.title)}\n${d.kind}, ${d.status}\n${d.id}`);

    const label = g.append('g').attr('class', 'labels').selectAll('text')
      .data(nodes).enter().append('text')
      .attr('class', 'label').attr('dx', 9).attr('dy', 3)
      .text(d => window.g.plain(d.title));

    sim.on('tick', () => {
      link
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('cx', d => d.x).attr('cy', d => d.y);
      label.attr('x', d => d.x).attr('y', d => d.y);
    });
  } catch (e) {
    stats.textContent = `Error: ${e.message}`;
  }
})();
</script>
