  <ol><li><a href="/projects">Projects</a></li><li><span aria-current="page" data-crumb-here></span></li></ol>

<div class="page-head">
  <h1 data-head>Projects</h1>
  <span class="badge badge-plain num" data-stat-total>Loading&hellip;</span>
  <span class="badge badge-plain num" data-stat-compliant hidden></span>

  <span class="legend" data-legend></span>

<p class="page-sub">Every project at a glance, derived from the instance manifest: thumbnail, live health, g-core compliance and gate state. Add a manifest entry, a card appears.</p>

<div id="proj-root"><p class="proj-loading">Loading&hellip;</p></div>

<style>
  body.projects-page .site-main > * { max-width: none; }

  .page-head h1 { font-size: 18px; font-weight: 500; margin: 0; }

    margin: var(--sp-2) 0 var(--sp-4);

  .legend .swatch { display: inline-flex; gap: 6px; align-items: center; }
  .legend .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: var(--sp-3);
  }

  .proj-card {
    padding: 0; overflow: hidden; display: flex; flex-direction: column;
    transition: border-color var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out);
  }
  .proj-card:hover { border-color: var(--border-hover); }

  /* Non-active projects (deprecated, fossil) render inert per the
     conventions: still visible, visibly not being built on. Hover restores
     them so the metadata stays readable. */
  .proj-card.inert { opacity: 0.6; }
  .proj-card.inert:hover, .proj-card.inert:focus-within { opacity: 1; }
  .proj-card.inert .proj-thumb-img { filter: grayscale(1); }
  .proj-card.inert:hover .proj-thumb-img { filter: none; }

  .proj-thumb {
    position: relative; display: block; aspect-ratio: 16 / 10;

  }

    width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block;
    transition: filter var(--dur-base) var(--ease-out);

    content: attr(data-initial);
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

  .proj-body { padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
  .proj-titlerow { display: flex; align-items: center; gap: var(--sp-2); justify-content: space-between; }
  .proj-title { font-size: var(--font-size-ui); font-weight: 500; margin: 0; overflow-wrap: anywhere; }

  .proj-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .proj-row .rowk { font-size: 12px; color: var(--text-placeholder); }

  .proj-links { display: flex; gap: var(--sp-3); flex-wrap: wrap; font-size: 12px; }
  .proj-links a {
    color: var(--text-secondary); text-decoration: none;
    display: inline-flex; align-items: center; gap: 5px;
    transition: color var(--dur-fast) var(--ease-out);
  }
  .proj-links a:hover { color: var(--text-primary); }

  .proj-lineage, .proj-commit, .proj-note { font-size: 12px; color: var(--text-placeholder); line-height: 1.5; }
  .proj-lineage, .proj-commit { display: flex; flex-wrap: wrap; column-gap: 12px; }
  .proj-commit .mono { color: var(--text-secondary); }
  .proj-note { font-style: italic; }

  .proj-loading { color: var(--text-secondary); font-size: 12px; margin: 0; }
  /* Gates: the compact line on each card, and the project view. */
  .proj-title a { color: inherit; text-decoration: none; }
  .proj-title a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .proj-gates { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); min-height: var(--h-control-sm); font-size: 12px; line-height: var(--lh-1); color: var(--text-secondary); text-decoration: none; }
  a.proj-gates:hover .pg-more { color: var(--text-primary); }
  .proj-gates .rowk { color: var(--text-placeholder); }
  .proj-gates .pg-more { margin-left: auto; display: inline-flex; align-items: center; gap: var(--sp-1); }
  .pg-ok { color: var(--ok-text); }
  .pg-warn { color: var(--warn-text); }
  .pg-danger { color: var(--danger-text); }

  .g-crumbs { margin-bottom: var(--sp-2); }
  .proj-detail { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
  @media (max-width: 760px) { .proj-detail { grid-template-columns: minmax(0, 1fr); } }
  .pg-card { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
  .pg-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .pg-head h2 { margin: 0; font-size: var(--font-size-ui); font-weight: 500; }
  .pg-head .btn { margin-left: auto; text-decoration: none; }
  @media (min-width: 761px) { .proj-detail > .proj-card { position: sticky; top: var(--sp-4); } }
  @media (max-width: 760px) { .proj-detail .proj-thumb { display: none; } }
  .pg-charter { margin: 0; font-size: 12px; line-height: var(--lh-1); color: var(--text-secondary); }
  .pg-charter strong { font-weight: 500; color: var(--text-primary); }
  .pg-alert { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-3); border: 1px solid var(--danger-edge); border-radius: var(--radius-card); font-size: 12px; line-height: var(--lh-1); color: var(--text-primary); }
  .pg-alert i { color: var(--danger-text); font-size: 16px; line-height: var(--lh-1); flex: none; }
  .pg-counts { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: var(--lh-1); color: var(--text-secondary); }
  .pg-counts b { font-weight: 500; color: var(--text-primary); }
  .pg-table td { vertical-align: middle; }
  .pg-table .pg-gate { overflow-wrap: break-word; }
  .pg-table .pg-id { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); }
  .pg-table .pg-sub { display: none; margin-top: var(--sp-1); font-size: 12px; color: var(--text-secondary); }
  .pg-table .pg-when { white-space: nowrap; color: var(--text-secondary); }
  .pg-table tr.pg-alarm td:first-child { box-shadow: inset 2px 0 0 var(--danger-text); }
  .pg-table .pg-quiet { color: var(--text-placeholder); }
  @media (max-width: 560px) {
    .pg-table .pg-when, .pg-table th.pg-when { display: none; }
    .pg-table .pg-sub { display: block; }
  }
  .pg-msg { margin: 0; font-size: 12px; line-height: var(--lh-1); color: var(--text-secondary); }
</style>

<script>
(async () => {
  const root = document.getElementById('proj-root');
  const statTotal = document.querySelector('[data-stat-total]');
  const statComp = document.querySelector('[data-stat-compliant]');
  const legend = document.querySelector('[data-legend]');
  const BRAIN = BRAIN_API;
  const POLL_MS = 60000;

  legend.innerHTML = [
    ['Up', 'var(--ok-text)'],
    ['Down', 'var(--danger-text)'],
    ['Unknown or no service', 'var(--text-placeholder)'],
  ].map(([label, color]) =>
    `<span class="swatch"><span class="dot" style="background:${color}"></span>${label}</span>`
  ).join('');

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
  ));

  // Live states map onto the shipped badge kinds; unknown keeps the plain dot.
  const BADGE_KIND = { up: 'ok', down: 'danger', warn: 'warn', unknown: '' };
  const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;

  // The state is tracked here rather than read back off the element: g.status
  // leaves its own animation classes behind, so a className comparison would
  // re-blink every badge on every poll.
  function setBadge(el, state, label, animate) {
    if (el.dataset.state === state) return;
    el.dataset.state = state;
    const kind = BADGE_KIND[state] || '';
    if (animate && window.g && g.status) { g.status(el, { kind, label }); return; }
    el.className = 'badge' + (kind ? ' badge-' + kind : '');
    el.textContent = label;
  }

  function fail(title, desc) {
    root.innerHTML = `<div class="empty"><div class="e-title">${esc(title)}</div><div class="e-desc">${esc(desc)}</div></div>`;
  }

  // ── manifest (projects, services, hosts) ──
  let manifest;
  try {
    const r = await fetch('/api/gcore');
    if (!r.ok) throw new Error(`gcore ${r.status}`);
    manifest = (await r.json()).manifest;
  } catch (e) {
    fail('Could not load the manifest', `The /api/gcore route failed (${e.message}). Reload once the server is back.`);
    setBadge(statTotal, 'down', 'Manifest unavailable', false);
    statTotal.classList.add('num');
    return;
  }

  // ── screenshot + git sidecar (graceful if the job hasn't run) ──
  let meta = {};
  try {
    const r = await fetch('/api/projects/meta');
    if (r.ok) meta = (await r.json()).projects || {};
  } catch (e) { /* page still works without thumbnails / commits */ }

  // ── compliance (nerves) + lineage, both best-effort ──
  const compliance = {};
  const lineage = {};
  await Promise.all([
    fetch(`${BRAIN}/api/nerves`).then(r => r.ok ? r.json() : null).then(d => {
      if (!d) return;
      for (const n of d.nodes) if (n.type === 'repo') compliance[n.label] = { compliant: n.compliant, title: n.title };
    }).catch(() => {}),
    fetch(`${BRAIN}/api/lineage`).then(r => r.ok ? r.json() : null).then(d => {
      if (!d) return;
      const label = {};
      for (const n of d.nodes) label[n.id] = n.label;
      for (const lk of d.links) {
        const rid = String(lk.source).replace(/^repo-/, '');
        const tgt = label[lk.target] || String(lk.target).replace(/^src-/, '');
        (lineage[rid] = lineage[rid] || {})[lk.rel] = tgt;
      }
    }).catch(() => {}),
  ]);

  // ── index services by repo (the join key is service.repo == project.id) ──
  const svcByRepo = {};
  for (const s of (manifest.services || [])) (svcByRepo[s.repo] = svcByRepo[s.repo] || []).push(s);

  const projects = manifest.projects || [];
  const hostName = {};
  for (const h of (manifest.hosts || [])) hostName[h.id] = (h.aliases && h.aliases[1]) || h.provider || h.id;

  const projectHref = (id) => `/projects?project=${encodeURIComponent(id)}`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

  // ── gates (g-levels, through /api/levels): counts and states only, notes stay on /levels ──
  const STATE = {
    met: ['Met', 'badge-ok'], attempted: ['Attempted', 'badge-info'], waived: ['Waived', 'badge-plain'],
    impossible: ['Impossible', 'badge-warn'], caught: ['Caught', 'badge-danger'], silent: ['Silent', 'badge-warn'],
    hook: ['Hook', 'badge-plain'], 'not-run': ['Not run', ''],
  };
  const COUNT_ORDER = ['caught', 'impossible', 'silent', 'attempted', 'met', 'waived', 'not-run', 'hook'];

  function ago(ts) {
    if (!ts) return '';
    const s = (Date.now() - new Date(ts).getTime()) / 1000;
    if (!(s >= 0)) return ts.slice(0, 10);
    if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`;
    if (s < 86400) return plural(Math.round(s / 3600), 'hour') + ' ago';
    if (s < 86400 * 60) return plural(Math.round(s / 86400), 'day') + ' ago';
    return ts.slice(0, 10);
  }

  // One line on a card: the blocking trouble first, then how many gates are met.
  function gatesLine(g) {
    const parts = ['<span class="rowk">Gates</span>'];
    if (!g || !g.total) {
      parts.push('<span>No gates in scope</span>');
      return parts.join('');
    }
    const c = g.counts || {}, b = g.blocking || {};
    if (b.silent) parts.push(`<span class="badge badge-danger">${b.silent} blocking silent</span>`);
    if (b.failing) parts.push(`<span class="badge badge-danger">${b.failing} blocking failing</span>`);
    parts.push(`<span class="num">${c.met || 0} of ${g.total} met</span>`);
    const quiet = (c.silent || 0) - (b.silent || 0);
    if (quiet > 0) parts.push(`<span class="pg-warn num">${quiet} silent</span>`);
    parts.push('<span class="pg-more" aria-hidden="true"><i class="ph ph-caret-right"></i></span>');
    return parts.join('');
  }

  async function paintGateLines() {
    let data = null;
    try {
      const r = await fetch('/api/levels/projects');
      if (r.ok) data = (await r.json()).projects || {};
    } catch (e) { /* the line says so below */ }
    for (const el of root.querySelectorAll('[data-gates]')) {
      const id = el.closest('[data-repo]').dataset.repo;
      el.innerHTML = data ? gatesLine(data[id]) : '<span class="rowk">Gates</span><span>Not available right now</span>';
    }
  }

  // The project view: the charter covering this repo, every gate it pins and the latest result per gate.
  function gateRow(x) {
    const [label, kind] = STATE[x.state] || [x.state, ''];
    const alarm = x.blocking && (x.state === 'silent' || x.state === 'caught' || x.state === 'impossible');
    const badge = kind ? `<span class="badge ${alarm ? 'badge-danger' : kind}">${esc(label)}</span>`
                       : `<span class="pg-quiet">${esc(label)}</span>`;
    const when = x.last ? `<span class="num" title="${esc(x.last)}">${esc(ago(x.last))}</span>`
                        : '<span class="pg-quiet">Never</span>';
    return `<tr class="${alarm ? 'pg-alarm' : ''}">
      <td class="pg-gate"><div class="pg-id"><span class="mono">${esc(x.gate).replace(/([.-])/g, '$1<wbr>')}</span>${x.blocking ? '<span class="badge badge-plain">Blocking</span>' : ''}</div>
        <div class="pg-sub">${x.last ? 'Last reported ' + esc(ago(x.last)) : 'Never reported here'}</div></td>
      <td>${badge}</td>
      <td class="pg-when">${when}</td>
    </tr>`;
  }

  function gatesSection(v) {
    if (!v || !v.charter) {
      return `<div class="pg-head"><h2>Gates</h2><a class="btn btn-tertiary btn-sm" href="/levels">Open levels</a></div>
        <p class="pg-msg">No charter covers this repo, so no gates are checked here.</p>`;
    }
    const chain = (v.chain || []).map(c => c.id);
    const own = chain[chain.length - 1];
    const parents = chain.slice(0, -1).reverse();
    const charter = `<p class="pg-charter">Charter <strong>${esc(own)}</strong>${parents.length ? `, extending ${parents.map(esc).join(' and ')}` : ''}</p>`;
    const gates = (v.gates || []).slice().sort((a, b) => (b.blocking ? 1 : 0) - (a.blocking ? 1 : 0));
    const silentBlocking = gates.filter(x => x.blocking && x.state === 'silent');
    const failingBlocking = gates.filter(x => x.blocking && (x.state === 'caught' || x.state === 'impossible'));
    const alerts = [];
    if (silentBlocking.length) alerts.push(`${plural(silentBlocking.length, 'blocking gate has', 'blocking gates have')} never reported for this repo.`);
    if (failingBlocking.length) alerts.push(`${plural(failingBlocking.length, 'blocking gate')} last reported a catch or could not run.`);
    const marked = silentBlocking.length + failingBlocking.length === 1 ? 'It is marked in red below.' : 'They are marked in red below.';
    const alert = alerts.length
      ? `<div class="pg-alert" role="status"><i class="ph ph-warning-circle" aria-hidden="true"></i><span>${alerts.join(' ')} ${marked}</span></div>`
      : '';
    const c = v.counts || {};
    const counts = COUNT_ORDER.filter(k => c[k]).map(k =>
      `<li><b class="num">${c[k]}</b> ${esc(STATE[k][0].toLowerCase())}</li>`).join('');
    return `<div class="pg-head"><h2>Gates</h2><a class="btn btn-tertiary btn-sm" href="/levels">Open levels</a></div>
      ${charter}
      ${alert}
      <ul class="pg-counts">${counts}</ul>
      <div class="table-wrap"><table class="table pg-table">
        <thead><tr><th>Gate</th><th>Result</th><th class="pg-when">Last reported</th></tr></thead>
        <tbody>${gates.map(gateRow).join('')}</tbody>
      </table></div>`;
  }

  async function renderProject(p) {
    document.querySelector('[data-crumbs]').hidden = false;
    document.querySelector('[data-crumb-here]').textContent = p.id;
    document.querySelector('[data-head]').textContent = p.id;
    document.title = `${p.id}: Projects`;
    statTotal.hidden = true;
    legend.hidden = true;
    document.querySelector('.page-sub').textContent =
      'The g-levels charter that covers this repo, every gate it pins and the latest result per gate. Notes stay on the levels page.';
    root.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'proj-detail';
    const card = buildCard(p);
    card.querySelector('[data-gates]').remove();
    const gatesCard = document.createElement('section');
    gatesCard.className = 'card pg-card';
    gatesCard.setAttribute('aria-label', 'Gates');
    gatesCard.innerHTML = '<div class="pg-head"><h2>Gates</h2></div><p class="pg-msg">Loading</p>';
    wrap.append(card, gatesCard);
    root.appendChild(wrap);
    try {
      const r = await fetch(`/api/levels/project/${encodeURIComponent(p.id)}`);
      if (!r.ok) throw new Error(r.status);
      gatesCard.innerHTML = gatesSection(await r.json());
    } catch (e) {
      gatesCard.innerHTML = `<div class="pg-head"><h2>Gates</h2><a class="btn btn-tertiary btn-sm" href="/levels">Open levels</a></div>
        <p class="pg-msg">The gate results did not load. Reload the page to try again.</p>`;
    }
  }

  // ── build card ──
  function buildCard(p) {
    const id = p.id;
    const svcs = svcByRepo[id] || [];
    const domain = (svcs.find(s => s.domain) || {}).domain || null;
    const liveUrl = domain ? `https://${domain}` : null;
    const m = meta[id] || {};
    const comp = compliance[id] || {};
    // Heading is the manifest id: unique, stable, what every other view keys
    // on. The brain `title` (often a domain-like string that mismatches the
    // live domain, e.g. a .co.uk title on a site served at .com) goes to the
    // tooltip only, so it can't read as a "merged" card.
    const titleAttr = comp.title && comp.title !== id ? comp.title : id;
    const initial = (id[0] || '?').toUpperCase();
    const status = p.status || 'active';

    const card = document.createElement('div');
    card.className = 'card proj-card' + (status === 'active' ? '' : ' inert');
    card.dataset.repo = id;

    // thumbnail (anchor to live site, else github)
    const href = liveUrl || p.url || '#';
    const knownNoShot = m.shot === false;
    const thumbInner = knownNoShot
      ? ''
      : `<img class="proj-thumb-img" src="/api/projects/shot/${encodeURIComponent(id)}" alt="" loading="lazy"
             onerror="this.closest('.proj-thumb').classList.add('noshot'); this.remove();">`;
    const thumb = `<a class="proj-thumb${knownNoShot ? ' noshot' : ''}" data-initial="${esc(initial)}"
                      href="${esc(href)}" target="_blank" rel="noopener">${thumbInner}</a>`;

    // health (only when a service maps to this project)
    const health = svcs.length
      ? `<span class="badge" data-health>&hellip;</span>`
      : `<span class="badge badge-plain">No service</span>`;

    // badges: lifecycle first, then compliance
    const badges = [];
    if (status !== 'active') badges.push(`<span class="badge badge-warn">${esc(cap(status))}</span>`);
    badges.push(p.managed
      ? `<span class="badge badge-plain">Managed</span>`
      : `<span class="badge badge-plain">Unmanaged</span>`);
    if (comp.compliant === true) badges.push(`<span class="badge badge-ok">Compliant</span>`);
    else if (comp.compliant === false) badges.push(`<span class="badge badge-plain">Not compliant</span>`);

    // links
    const links = [];
    if (liveUrl) links.push(`<a href="${esc(liveUrl)}" target="_blank" rel="noopener"><i class="ph ph-globe"></i>${esc(domain)}</a>`);
    if (p.url) links.push(`<a href="${esc(p.url)}" target="_blank" rel="noopener"><i class="ph ph-github-logo"></i>GitHub</a>`);

    // dependencies (badge kind patched live by refreshStatus)
    const deps = (m.depends || []).map(d =>
      `<span class="badge" data-dep-id="${esc(d)}">${esc(d)}</span>`
    ).join('');
    const depsRow = deps ? `<div class="proj-row"><span class="rowk">Deps</span>${deps}</div>` : '';

    // lineage
    const ln = lineage[id] || {};
    const lnParts = [];
    if (ln.starter) lnParts.push(`Starter: ${esc(ln.starter)}`);
    if (ln.design) lnParts.push(`Design: ${esc(ln.design)}`);
    const lineageRow = lnParts.length ? `<div class="proj-lineage">${lnParts.map(p => `<span>${p}</span>`).join('')}</div>` : '';

    // last commit
    const lc = m.last_commit;
    const commitRow = lc
      ? `<div class="proj-commit"><span class="mono">${esc(lc.hash)}</span><span>${esc(lc.date)}</span><span>${esc(lc.subject)}</span></div>`
      : '';

    const noteRow = p.note ? `<div class="proj-note">${esc(p.note)}</div>` : '';

    card.innerHTML = `
      ${thumb}
      <div class="proj-body">
        <div class="proj-titlerow">
          <h3 class="proj-title" title="${esc(titleAttr)}"><a href="${projectHref(id)}">${esc(id)}</a></h3>
          ${health}
        </div>
        <div class="proj-row">${badges.join('')}</div>
        ${links.length ? `<div class="proj-links">${links.join('')}</div>` : ''}
        <a class="proj-gates" href="${projectHref(id)}" title="Open the gates for ${esc(id)}" data-gates><span class="rowk">Gates</span><span>Loading</span></a>
        ${depsRow}
        ${lineageRow}
        ${commitRow}
        ${noteRow}
      </div>`;
    return card;
  }

  const wanted = new URLSearchParams(location.search).get('project');
  const chosen = wanted && projects.find(p => p.id === wanted);
  // ── render grouped by host, or one project's view ──
  root.innerHTML = '';
  if (chosen) {
    renderProject(chosen);
  } else if (!projects.length) {
    fail('No projects yet', 'Nothing in the manifest to show. Add an entry to the instance manifest and a card appears here.');
    setBadge(statTotal, 'unknown', '0 projects', false);
    return;
  } else {
    const byHost = {};
    for (const p of projects) (byHost[p.host || '?'] = byHost[p.host || '?'] || []).push(p);

    for (const [host, list] of Object.entries(byHost)) {
      const head = document.createElement('div');
      head.className = 'proj-host-head';
      head.innerHTML = `<span class="host-id">${esc(host)}</span>` +
        (hostName[host] ? `<span class="host-name">${esc(hostName[host])}</span>` : '');
      root.appendChild(head);
      const grid = document.createElement('div');
      grid.className = 'proj-grid';
      for (const p of list) grid.appendChild(buildCard(p));
      root.appendChild(grid);
    }

    const compliantCount = projects.filter(p => (compliance[p.id] || {}).compliant === true).length;
    paintGateLines();
    statTotal.textContent = `${projects.length} projects`;
    statComp.textContent = `${compliantCount} g-core compliant`;
    statComp.hidden = false;
  }

  // ── live health (services + dependency badges), polled ──
  function aggState(states) {
    if (!states || !states.length) return 'unknown';
    if (states.includes('down')) return 'down';
    if (states.includes('up')) return 'up';
    return 'unknown';
  }

  // First pass paints silently; later passes animate, so a blink always means
  // something actually changed.
  let painted = false;

  async function refreshStatus() {
    let snap;
    try {
      const r = await fetch(`${BRAIN}/api/status`);
      if (!r.ok) throw new Error(r.status);
      snap = await r.json();
    } catch (e) { return; }

    const svcStates = {};
    for (const s of (snap.services || [])) (svcStates[s.repo] = svcStates[s.repo] || []).push(s.state);

    for (const card of root.querySelectorAll('[data-repo]')) {
      const states = svcStates[card.dataset.repo];
      if (!states) continue; // no service, so leave the "No service" badge
      const el = card.querySelector('[data-health]');
      if (!el) continue;
      const state = aggState(states);
      el.title = state;
      setBadge(el, state, cap(state), painted);
    }

    const depState = {};
    for (const d of (snap.dependencies || [])) depState[d.id] = d.state;
    for (const pill of root.querySelectorAll('[data-dep-id]')) {
      const state = depState[pill.dataset.depId] || 'unknown';
      pill.title = `${pill.dataset.depId}: ${state}`;
      setBadge(pill, state, pill.dataset.depId, painted);
    }

    painted = true;
  }

  await refreshStatus();
  setInterval(refreshStatus, POLL_MS);
})();
</script>
