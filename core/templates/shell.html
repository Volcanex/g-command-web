<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="g-admin-project" content="gcommand">
  <meta name="g-command" content="{{ g_command }}">
  <title>{{ title }} - {{ site_name }}</title>
  <meta name="description" content="{{ description }}">
  <!-- Brain API origin, set by BRAIN_API at compile time. Page scripts read
       window.BRAIN_API instead of naming the host. -->
  <meta name="brain-api" content="{{ brain_api }}">
  <script>window.BRAIN_API=document.querySelector('meta[name="brain-api"]').content;</script>
  <link rel="icon" type="image/svg+xml" href="/css/gsys/brand/icon.svg">
  <!-- Apply the stored theme before first paint. g-design is dark by
       default (no attribute); only an explicit choice sets one. Key
       matches g-ui.js (g.theme). -->
  <script>(function(){try{var t=localStorage.getItem('g-theme');if(t)document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('g-density')==='compact')document.documentElement.setAttribute('data-density','compact');}catch(e){}})();</script>
  <!-- Page styles live inside the streamed body, so on a slow connection the
       markup would paint unstyled and then jump. Hold the content invisible
       until chrome.js (deferred, runs after the full parse) reveals it with
       the entrance stagger. The keyframe is a bounded fallback: if JS never
       arrives, the page still reveals itself after 1.5s. -->
  <style>.site-main{opacity:0;animation:g-page-fallback .2s ease-out 1.5s forwards}@keyframes g-page-fallback{to{opacity:1}}</style>
  <noscript><style>.site-main{opacity:1;animation:none}</style></noscript>
  <link rel="preload" href="/css/vendor/phosphor/Phosphor.woff2" as="font" type="font/woff2" crossorigin>
  <!-- g-design (vendored): g.css, then the app kit (Studio's shell look,
       g-ui-preact kit.css), then g-command-web's own chrome -->
  <link rel="stylesheet" href="/css/gsys/g.css">
  <link rel="stylesheet" href="/css/gsys/kit/kit.css">
  <link rel="stylesheet" href="/css/gsys/chrome.css">
  <link rel="stylesheet" href="/css/vendor/phosphor/style.css">
  <script>if(/ GCommandApp\//.test(navigator.userAgent))document.documentElement.setAttribute('data-app','');</script>
  <script defer src="/css/gsys/g-ui.js"></script>
  <script defer src="/js/chrome.js"></script>
  <script defer src="/js/hub.js"></script>
  <script type="module">import { wireRails } from "/css/gsys/kit/rail.js"; wireRails();</script>
  <!-- Studio's default cursor (kit cursor.js), so the pointer is the same here and over the
       embedded Studio at /studio. Only the cursor: no coworking. -->
  <script type="module">import { wireOwnCursor } from "/css/gsys/kit/cursor.js"; wireOwnCursor();</script>
</head>
<body class="g-shell {{ body_class }}" data-rail="pinned" data-nav-current="{{ nav_current }}">
  <!-- The rail starts open (kit rail.js, data-rail-default); a rail the viewer collapsed is
       set before first paint, same key, so it never flashes open. -->
  <script>try{if(localStorage.getItem('g-rail-command')==='collapsed')document.body.setAttribute('data-rail','collapsed');}catch(e){}</script>

  <aside aria-label="Main">
    <div class="brand-row">
      <a href="/" class="brand">
        <span class="g-mark" aria-hidden="true"></span>
        <b>Command</b>
      </a>
      <button class="g-rail-toggle" type="button" data-rail-key="g-rail-command" data-rail-default="open" aria-label="Collapse"></button>
    </div>

{{! nav_pages }}

    <div class="side-foot">
      <a class="btn btn-tertiary btn-sm btn-icon" href="/logout" data-tip="Log out" aria-label="Log out"><i class="ph ph-sign-out" aria-hidden="true"></i></a>
      <span class="grow"></span>
      <button class="btn btn-tertiary btn-sm btn-icon" id="t-density" data-tip="Comfortable and compact" aria-label="Density"><i class="ph ph-rows" aria-hidden="true"></i></button>
      <button class="btn btn-tertiary btn-sm btn-icon" id="t-theme" data-tip="Dark and light" aria-label="Theme"><i class="ph ph-circle-half" aria-hidden="true"></i></button>
    </div>
  </aside>

  <main class="g-main">
    <!-- The slim bar (kit .topbar-slim, 48px, g-navigation R7): the menu button on a
         phone, where the page sits (Parent, then Page, from compile.py crumbs) and
         page-level actions, which a page script puts in [data-topbar-actions]. -->
    <header class="topbar topbar-slim">
      <button class="btn btn-tertiary btn-sm btn-icon g-nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" onclick="toggleNav()"><i class="ph ph-list" aria-hidden="true"></i></button>
      {{! crumbs }}
      <span class="grow"></span>
      <div class="topbar-group" data-topbar-actions></div>
    </header>

    <div class="content" id="main-content">
      <div class="content-page site-main">
        {{! content }}
      </div>
    </div>

    <footer class="g-status">
      <span>{{ site_name }}</span>
      <span class="host">{{ public_host }}</span>
      <a href="{{ owner_site_url }}" class="host hide-sm" rel="noopener"{{ owner_site_hidden }}>{{ owner_site_label }}</a>
      <span data-clock></span>
    </footer>
  </main>

  <div class="g-scrim"></div>

</body>
</html>
